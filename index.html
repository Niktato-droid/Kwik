<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kwik</title>
<meta name="description" content="Devis, factures et comptabilité simple pour micro-entrepreneurs.">
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1122" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kwik">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Kwik : encre bleue de stylo sur papier, surligneur jaune pour ce qui compte. */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#EFF1F5; --ink:#161A2B; --muted:#4B5270; --line:#DFE2EA;
  --brand:#2B3FD6; --brand-ink:#FFFFFF; --brand-soft:#E8EBFF; --brand-deep:#1B2A9E;
  --hi:#FFD23F; --hi-ink:#2A2200; --hi-soft:#FFF4C7;
  --ok:#147A42; --ok-soft:#DFF3E7; --warn:#9A5A00; --warn-soft:#FDF0D7; --bad:#C0262D; --bad-soft:#FCE6E7;
  --shadow:0 1px 2px rgba(22,26,43,.04),0 2px 10px rgba(22,26,43,.05);
  --font-d:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-b:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r-s:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1122; --surface:#171B33; --sunk:#11152A; --ink:#EDEFF8; --muted:#9AA0BF; --line:#272C4A;
  --brand:#7D8CFF; --brand-ink:#0E1122; --brand-soft:#1F2550; --brand-deep:#2B3FD6;
  --hi:#FFD23F; --hi-ink:#2A2200; --hi-soft:#3A3315;
  --ok:#6ED69A; --ok-soft:#133224; --warn:#F2B75B; --warn-soft:#38290F; --bad:#FF8A8F; --bad-soft:#3D171B;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1122; --surface:#171B33; --sunk:#11152A; --ink:#EDEFF8; --muted:#9AA0BF; --line:#272C4A;
  --brand:#7D8CFF; --brand-ink:#0E1122; --brand-soft:#1F2550; --brand-deep:#2B3FD6;
  --hi:#FFD23F; --hi-ink:#2A2200; --hi-soft:#3A3315;
  --ok:#6ED69A; --ok-soft:#133224; --warn:#F2B75B; --warn-soft:#38290F; --bad:#FF8A8F; --bad-soft:#3D171B;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--font-b);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* En-tête */
.top{position:sticky;top:0;z-index:6;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:6px;min-height:56px}
.top h1{font:800 22px/1.1 var(--font-d);letter-spacing:-.3px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:22px;height:22px}
svg.i{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px;flex:none}
main{max-width:640px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

/* Barre du bas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:0 max(4px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px,env(safe-area-inset-left))}
.tabs a{flex:1;text-align:center;padding:9px 2px 10px;font-size:11.5px;font-weight:500;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs a svg{width:24px;height:24px}
.tabs a.on{color:var(--brand);font-weight:700}
.tabs .fab-slot{flex:1;display:flex;justify-content:center}
.fab{width:60px;height:60px;border-radius:50%;border:0;background:var(--hi);color:var(--hi-ink);box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;transform:translateY(-16px)}
.fab svg{width:30px;height:30px;stroke-width:2.6}

/* Textes */
h2{font:700 18px/1.2 var(--font-d);margin:24px 0 10px;letter-spacing:-.2px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}

/* Surfaces */
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.item{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item .av{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font:700 15px var(--font-d);flex:none}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.amount{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);flex:none}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;font-weight:600}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.grey{background:var(--sunk);color:var(--muted)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--surface);border-radius:14px;padding:12px 16px;cursor:pointer;text-decoration:none;color:var(--ink);min-height:48px;font-weight:600;box-shadow:var(--shadow)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.hi{background:var(--hi);color:var(--hi-ink)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.btns>.btn{flex:1 1 130px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.quick a,.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:0;border-radius:16px;padding:12px 4px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600;box-shadow:var(--shadow);cursor:pointer;text-align:center}
.quick .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand)}
.quick .ic svg{width:22px;height:22px}

/* Puces & recherche */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding:2px 0 4px;scrollbar-width:none}
.chip{text-decoration:none;color:var(--ink);background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.chip .n{opacity:.65;margin-left:4px}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px 12px 42px;font-size:16px;min-height:48px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}

/* Formulaires */
label.f{display:block;margin-bottom:14px;font-size:13.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,.field{display:block;width:100%;margin-top:6px;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--sunk);color:var(--ink);font-size:16px;font-weight:400;min-height:48px}
label.f textarea{min-height:84px;resize:vertical}
label.f input:focus,label.f select:focus,label.f textarea:focus,.field:focus{border-color:var(--brand);outline:0;background:var(--surface)}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 14px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px;margin-top:6px}
.seg label{flex:1;margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible+span{outline:3px solid var(--brand)}

.seg.big{margin:0 0 18px;padding:5px}
.seg.big span{padding:12px 6px;font-size:16px}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sw{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center;font-weight:600}
.sw.on{border-color:var(--ink)}
.sw i{display:flex;width:44px;height:28px;border-radius:8px;overflow:hidden;flex:none}
.sw i b{flex:1}
/* Assistant */
body.wizard .tabs,body.wizard .top,body.wizard #actionbar{display:none}
body.wizard main{padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.wz-prog{display:flex;gap:6px;margin:4px 0 22px}
.wz-prog i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.wz-prog i.on{background:var(--brand)}
.wz-step{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.wz-t{font:800 30px/1.1 var(--font-d);letter-spacing:-.5px;margin:6px 0 10px;text-wrap:balance}
.wz-p{color:var(--muted);margin:0 0 20px;font-size:17px}
.wz-foot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:linear-gradient(to bottom,transparent,var(--bg) 25%)}
.wz-foot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.wz-foot .btn{flex:1;min-height:54px;font-size:17px}
.wz-foot .btn.ghost{flex:0 0 auto}
.choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer;font-size:16px}
.choice.on{border-color:var(--brand);background:var(--brand-soft)}
.choice .em{font-size:30px;line-height:1;flex:none}
.choice b{display:block;font-size:17px}
.choice span.s{color:var(--muted);font-size:14.5px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:18px;padding:26px 16px;background:var(--surface);cursor:pointer;text-align:center;color:var(--muted)}
.drop input{display:none}
.mini-doc{background:#fff;color:#111;border-radius:12px;padding:16px;border:1px solid var(--line);font:12px/1.4 Arial,sans-serif;margin-top:14px}
.mini-doc img{max-height:50px;max-width:130px;display:block;margin-bottom:6px}
.check{display:flex;gap:12px;align-items:center;padding:12px 0;font-weight:500;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--brand)}
.bullets{list-style:none;padding:0;margin:0 0 10px}
.bullets li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:16.5px}
.bullets li .em{font-size:24px;line-height:1.1}
/* Barres des mois */
.months{display:flex;align-items:flex-end;gap:4px;height:62px;margin:2px 0 4px}
.months div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.months i{display:block;width:100%;max-width:18px;border-radius:5px 5px 2px 2px;background:rgba(255,255,255,.28);min-height:3px}
.months .on i{background:var(--hi)}
.months span{font-size:10.5px;opacity:.7;line-height:1}
.months .on span{opacity:1;font-weight:700}
.aside{display:flex;gap:14px;align-items:center}
.aside .em{font-size:30px}
.aside b.big{font:800 24px var(--font-d);display:block;font-variant-numeric:tabular-nums}
/* Confettis */
.confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:tomber 1.6s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes tomber{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
.doc .cgv{margin-top:26px;font-size:9.5px;line-height:1.45;color:#222;columns:2;column-gap:22px}
.doc .cgv h4{column-span:all;font-size:13px;margin:0 0 8px;color:#111}
@media print{.doc .cgv{break-before:page}}
/* Choix client (éditeur) */
.picker{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line);background:var(--sunk);cursor:pointer;text-align:left;min-height:58px}
.picker.set{border-style:solid;background:var(--surface)}
.picker .grow{flex:1;min-width:0}

/* Lignes */
.ligne{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.ligne .des{width:100%;border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:6px 0 8px;font-size:16px;font-weight:600;color:var(--ink);border-radius:0}
.ligne .des:focus{outline:0;border-color:var(--brand)}
.ligne .row{display:flex;gap:10px;align-items:flex-end;margin-top:12px;flex-wrap:wrap}
.ligne .lab{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
.stepper{display:flex;align-items:center;background:var(--sunk);border-radius:12px;height:44px}
.stepper button{width:40px;height:44px;border:0;background:none;font-size:20px;font-weight:600;cursor:pointer;color:var(--brand)}
.stepper input{width:48px;border:0;background:transparent;text-align:center;font-size:16px;font-weight:600;padding:0}
.mini{border:0;background:var(--sunk);border-radius:12px;height:44px;padding:0 10px;font-size:16px;width:100%}
.ligne .pu{flex:1;min-width:110px}
.ligne .un{width:84px}
.ligne .foot{display:flex;align-items:center;gap:10px;margin-top:12px}
.ligne .foot select{flex:1;min-width:0;border:0;background:var(--sunk);border-radius:10px;height:38px;padding:0 8px;font-size:14px}
.ligne .lt{font-weight:700;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:flex}
.x svg{width:20px;height:20px}
.add-row{display:flex;gap:10px;margin:4px 0 12px}
.add-row .btn{flex:1;box-shadow:none;border:1.5px dashed var(--line);background:transparent}

/* Barre d'action collante */
.actionbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:5;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.actionbar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 6px 24px rgba(20,26,51,.14)}
.actionbar .tot{flex:1;min-width:0}
.actionbar .tot b{font:800 22px/1 var(--font-d);font-variant-numeric:tabular-nums;display:block}
.actionbar .btn{box-shadow:none}
.has-actionbar main{padding-bottom:calc(190px + env(safe-area-inset-bottom))}

/* Accueil */
.hello{font:800 28px/1.1 var(--font-d);letter-spacing:-.5px;margin:6px 0 2px;text-wrap:balance}
.hero{background:var(--brand-deep);color:#fff;border-radius:22px;padding:18px;margin:14px 0 12px;position:relative;overflow:hidden}
.hero .l{font-size:13.5px;opacity:.8;font-weight:500}
.hero .v{font:800 36px/1.1 var(--font-d);letter-spacing:-.5px;margin:4px 0 14px;font-variant-numeric:tabular-nums}
.hero .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .split div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}
.hero .split b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.hero .split span{font-size:12.5px;opacity:.8}
.hero .split .mark{background:var(--hi);color:var(--hi-ink)}
.hero .split .mark span{opacity:.75}
.todo{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .dot{width:10px;height:10px;border-radius:50%;flex:none}
.steps .item .av{background:var(--sunk);color:var(--muted)}
.steps .item.done .av{background:var(--ok-soft);color:var(--ok)}
.steps .item.done .t{text-decoration:line-through;color:var(--muted)}
details.card summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font:700 16px var(--font-d)}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details.card[open] summary::after{transform:rotate(-135deg)}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
table.t th,table.t td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
table.t .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.warn i{background:var(--warn)}
.bar.bad i{background:var(--bad)}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--brand-soft);color:var(--brand)}
.alert a{color:inherit;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:34px 16px}
.empty svg{width:46px;height:46px;color:var(--line);margin-bottom:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.kpi .v{font:800 20px var(--font-d);font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}

/* Vue document */
.doc-head{display:flex;align-items:flex-start;gap:12px;margin:6px 0 12px}
.doc-head .big{font:800 34px/1.05 var(--font-d);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.paper-wrap{overflow:hidden;margin:0 0 12px;border-radius:10px}
.paper{background:#fff;color:#111;border-radius:10px;box-shadow:var(--shadow);padding:28px;width:640px;transform-origin:top left;border:1px solid var(--line)}

/* Feuille (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(10,12,25,.45);z-index:30;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;padding:10px max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font:800 20px var(--font-d);margin:0 0 12px}
.sheet .in{max-width:600px;margin:0 auto}
.sheet .item{padding:13px 4px}
.sheet .list{box-shadow:none;border:1px solid var(--line)}
.sheet .list .item{padding:13px 14px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.empty svg.i{width:46px;height:46px}
#print{display:none}

/* Document imprimé */
.doc{font:12.5px/1.45 "Helvetica Neue",Arial,sans-serif;color:#111}
.doc .hd{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px}
.doc .logo{max-width:150px;max-height:70px;display:block;margin-bottom:8px}
.doc .em b{font-size:14px}
.doc .ti{text-align:right}
.doc .ti h3{margin:0 0 6px;font:800 24px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:1px;color:#1B2A9E}
.doc .cl{margin:0 0 18px auto;width:48%;border:1px solid #ccd;border-radius:8px;padding:10px 12px}
.doc table{width:100%;border-collapse:collapse;margin-top:8px}
.doc th{background:#EEF0FA;text-align:left;padding:8px 6px;font-size:11.5px;border-bottom:1px solid #b9bfd8}
.doc td{padding:8px 6px;border-bottom:1px solid #e4e6ee;vertical-align:top}
.doc .n{text-align:right;white-space:nowrap}
.doc .tot{margin:12px 0 0 auto;width:50%}
.doc .tot div{display:flex;justify-content:space-between;padding:4px 6px}
.doc .tot .big{font-size:15px;font-weight:700;border-top:2px solid #111;margin-top:4px;padding-top:8px}
.doc .mentions{margin-top:22px;font-size:11px;color:#333;border-top:1px solid #ddd;padding-top:10px}
.doc .mentions p{margin:3px 0}
.doc .sign{margin-top:20px;display:flex;justify-content:flex-end}
.doc .sign div{border:1px solid #bbb;border-radius:6px;width:55%;height:95px;padding:8px;font-size:11px}
.doc .paid{display:inline-block;border:2px solid #147A42;color:#147A42;padding:4px 10px;border-radius:6px;font-weight:700;margin-top:8px}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .top,.tabs,main,#toast,.actionbar,.sheet,.scrim{display:none!important}
  #print{display:block}
}
@media (min-width:700px){.quick{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="top"><button class="icon-btn" id="back" aria-label="Retour" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h1 id="titre">Kwik</h1><span id="hdActions"></span></header>
<main id="main"></main>
<div id="actionbar"></div>
<nav class="tabs" id="tabs">
  <a href="#/accueil" data-r="accueil"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a>
  <a href="#/devis" data-r="devis"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>Devis</a>
  <div class="fab-slot"><button class="fab" id="fab" aria-label="Créer"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <a href="#/factures" data-r="factures"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Factures</a>
  <a href="#/clients" data-r="clients"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>Clients</a>
</nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="grab"></div><div class="in" id="sheetIn"></div></div>
<div id="print"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============ Outils ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const EUR=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const eur=n=>EUR.format(+n||0);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const dec=v=>String(v==null?'':v).replace('.',',');
const r2=n=>Math.round((+n||0)*100)/100;
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5);
const fdate=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y};
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const initiales=s=>String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2300)}
const IC={
  devis:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/>',
  facture:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  client:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  achat:'<path d="M5 7h14l-1.5 12a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  share:'<path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',
  pdf:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  euro:'<path d="M17 6a7 7 0 1 0 0 12M4 10h9M4 14h9"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'
};
const svg=(k,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

/* ============ Données ============ */
const KEY='kwik_v1';
const PARAMS_DEFAUT={tauxVente:12.3,tauxService:21.2,plafondVente:203100,plafondService:83600,tvaVente:85000,tvaService:37500};
function vide(){return{
  entreprise:{prenomNom:'',nomCommercial:'',siret:'',adresse:'',cp:'',ville:'',email:'',tel:'',activite:'service',logo:'',iban:'',bic:'',delai:30,assurance:'',mentionLibre:'',metier:'',cgv:'',cgvDevis:true,cgvFacture:true},
  clients:[],produits:[],devis:[],factures:[],achats:[],compteurs:{},params:Object.assign({},PARAMS_DEFAUT),derniereSauvegarde:''}}
function fusion(d){const v=vide();const out=Object.assign(v,d);out.entreprise=Object.assign(vide().entreprise,d.entreprise||{});out.params=Object.assign({},PARAMS_DEFAUT,d.params||{});return out}
function charger(){try{const s=localStorage.getItem(KEY);if(s)return fusion(JSON.parse(s))}catch(e){}return vide()}
let D=charger();
function enregistrer(){try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){info("Enregistrement impossible","Ce téléphone refuse d'enregistrer (mémoire pleine ou navigation privée). Exportez une sauvegarde depuis le menu.");return false}}
const parId=(arr,id)=>arr.find(x=>x.id===id);
function prochainNumero(type,dateIso){const y=(dateIso||today()).slice(0,4);const k=type+y;const n=(D.compteurs[k]||0)+1;D.compteurs[k]=n;return (type==='facture'?'F':'D')+y+'-'+String(n).padStart(type==='facture'?4:3,'0')}
const totalDoc=doc=>r2((doc.lignes||[]).reduce((s,l)=>s+num(l.qte)*num(l.pu),0));
function partsDoc(doc){const p={vente:0,service:0};(doc.lignes||[]).forEach(l=>{p[l.nature==='vente'?'vente':'service']+=num(l.qte)*num(l.pu)});p.vente=r2(p.vente);p.service=r2(p.service);return p}
function natureOperation(doc){const p=partsDoc(doc);if(p.vente&&p.service)return 'Livraison de biens et prestation de services';if(p.vente)return 'Livraison de biens';return 'Prestation de services'}
const enRetard=f=>f.statut!=='payee'&&f.echeance&&f.echeance<today();
function badgeFacture(f){if(f.statut==='payee')return '<span class="badge ok">Payée</span>';if(enRetard(f))return '<span class="badge bad">En retard</span>';return '<span class="badge warn">À encaisser</span>'}
const STATUTS_DEVIS={brouillon:['Brouillon','grey'],envoye:['Envoyé','warn'],accepte:['Accepté','ok'],refuse:['Refusé','bad'],facture:['Facturé','']};
function badgeDevis(d){const s=STATUTS_DEVIS[d.statut]||STATUTS_DEVIS.brouillon;return `<span class="badge ${s[1]}">${s[0]}</span>`}
const entrepriseOk=()=>!!(D.entreprise.prenomNom&&D.entreprise.siret&&D.entreprise.adresse);
const prenom=()=>String(D.entreprise.prenomNom||'').trim().split(/\s+/)[0]||'';
function encaisse(de,a){const r={vente:0,service:0,nb:0};
  D.factures.forEach(f=>{if(f.statut==='payee'&&f.paiement&&f.paiement.date>=de&&f.paiement.date<=a){const p=partsDoc(f);r.vente+=p.vente;r.service+=p.service;r.nb++}});
  r.vente=r2(r.vente);r.service=r2(r.service);r.total=r2(r.vente+r.service);
  r.cotis=r2(r.vente*D.params.tauxVente/100+r.service*D.params.tauxService/100);return r}

/* ============ Feuille, confirmation ============ */
let sheetResolve=null;
function openSheet(html,onOpen){const s=$('#sheet'),sc=$('#scrim');$('#sheetIn').innerHTML=html;s.hidden=false;sc.hidden=false;requestAnimationFrame(()=>{s.classList.add('on');sc.classList.add('on')});s.scrollTop=0;if(onOpen)setTimeout(onOpen,60)}
function closeSheet(v){const s=$('#sheet'),sc=$('#scrim');s.classList.remove('on');sc.classList.remove('on');setTimeout(()=>{s.hidden=true;sc.hidden=true},230);if(sheetResolve){const r=sheetResolve;sheetResolve=null;r(v)}}
$('#scrim').onclick=()=>closeSheet(false);
function ask(titre,texte,ok='Confirmer',danger=false){return new Promise(res=>{sheetResolve=res;
  openSheet(`<h3>${esc(titre)}</h3>${texte?`<p class="muted" style="margin-top:-4px">${esc(texte)}</p>`:''}<div class="btns"><button class="btn ghost" onclick="closeSheet(false)">Annuler</button><button class="btn ${danger?'danger':'primary'}" style="${danger?'background:var(--bad);color:#fff':''}" onclick="closeSheet(true)">${esc(ok)}</button></div>`)})}
function info(titre,texte){openSheet(`<h3>${esc(titre)}</h3><p class="muted">${esc(texte)}</p><button class="btn primary block" onclick="closeSheet()">D'accord</button>`)}
function sheetCreer(){openSheet(`<h3>Créer</h3><div class="list">
  <a class="item" href="#/devis-edit/nouveau" onclick="closeSheet()"><span class="av">${svg('devis')}</span><span class="grow"><span class="t" style="display:block">Un devis</span><span class="s" style="display:block">Proposer un prix à un client</span></span>${svg('chev','i chev')}</a>
  <a class="item" href="#/facture-edit/nouveau" onclick="closeSheet()"><span class="av">${svg('facture')}</span><span class="grow"><span class="t" style="display:block">Une facture</span><span class="s" style="display:block">Demander le paiement d'un travail fait</span></span>${svg('chev','i chev')}</a>
  <a class="item" href="#/client-edit/nouveau" onclick="closeSheet()"><span class="av">${svg('client')}</span><span class="grow"><span class="t" style="display:block">Un client</span><span class="s" style="display:block">L'ajouter à votre carnet</span></span>${svg('chev','i chev')}</a>
  <a class="item" href="#/achat-edit/nouveau" onclick="closeSheet()"><span class="av">${svg('achat')}</span><span class="grow"><span class="t" style="display:block">Un achat</span><span class="s" style="display:block">Noter une dépense professionnelle</span></span>${svg('chev','i chev')}</a>
  </div>`)}
$('#fab').onclick=()=>{ED=null;if(location.hash==='#/devis-edit/nouveau')route();else go('#/devis-edit/nouveau')};
function sheetMenu(){const it=(h,ic,t,s)=>`<a class="item" href="${h}" onclick="closeSheet()"><span class="av">${svg(ic)}</span><span class="grow"><span class="t" style="display:block">${t}</span><span class="s" style="display:block">${s}</span></span>${svg('chev','i chev')}</a>`;
  openSheet(`<h3>Menu</h3><div class="list">${it('#/entreprise','client','Mon entreprise','Coordonnées, SIRET, logo, paiement')}${it('#/catalogue','devis','Catalogue','Vos prix enregistrés')}${it('#/recettes','euro','Livre des recettes','Rempli tout seul')}${it('#/achats','achat','Registre des achats','Vos dépenses')}${it('#/apparence','edit','Apparence','Couleurs, taille du texte, mode sombre')}${it('#/sauvegarde','copy','Sauvegarde','Exporter ou restaurer')}${it('#/aide','bell','Installer et aide','Écran d’accueil, PDF, bon à savoir')}</div><p class="small muted" style="text-align:center">Kwik · version 0.4 · vos données restent sur ce téléphone</p>`)}

/* ============ Routeur ============ */
let ED=null,RETOUR_CLIENT=null,AFTER=null;
function go(h){location.hash=h}
function titre(t,retour,actions){$('#titre').textContent=t;const b=$('#back');
  if(retour){b.hidden=false;b.onclick=()=>{if(typeof retour==='function')retour();else go(retour)}}else b.hidden=true;
  $('#hdActions').innerHTML=actions===undefined?`<button class="icon-btn" aria-label="Menu" onclick="sheetMenu()">${svg('menu')}</button>`:actions}
function actionbar(html){$('#actionbar').innerHTML=html?`<div class="actionbar"><div class="in">${html}</div></div>`:'';document.body.classList.toggle('has-actionbar',!!html)}
function route(){
  if(!$('#sheet').hidden)closeSheet(false);
  const parts=(location.hash.replace(/^#\/?/,'')||'accueil').split('/');
  const r=parts[0];
  const onglet={accueil:'accueil',devis:'devis','devis-edit':'devis',factures:'factures','facture-edit':'factures',voir:parts[1]==='devis'?'devis':'factures',clients:'clients','client-edit':'clients'}[r]||'';
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.r===onglet));
  actionbar('');document.body.classList.toggle('wizard',r==='bienvenue');
  const V={accueil:vAccueil,devis:vListeDevis,factures:vListeFactures,clients:vClients,'client-edit':vClientEdit,catalogue:vCatalogue,'produit-edit':vProduitEdit,achats:vAchats,'achat-edit':vAchatEdit,recettes:vRecettes,entreprise:vEntreprise,sauvegarde:vSauvegarde,'devis-edit':p=>vEditDoc('devis',p),'facture-edit':p=>vEditDoc('facture',p),voir:vVoir,aide:vAide,apparence:vApparence,bienvenue:vBienvenue}[r]||vAccueil;
  $('#main').innerHTML=V(parts[1],parts.slice(2).join('/'))||'';
  window.scrollTo(0,0);
  if(AFTER){const f=AFTER;AFTER=null;f()}
}
window.addEventListener('hashchange',route);

/* ============ Accueil ============ */
function periodes(){const t=today();const y=+t.slice(0,4),m=+t.slice(5,7);const pm=m===1?[y-1,12]:[y,m-1];const q=Math.floor((m-1)/3);const pq=q===0?[y-1,3]:[y,q-1];
  return[{lib:'Ce mois-ci',de:`${y}-${pad(m)}-01`,a:`${y}-${pad(m)}-31`},{lib:'Mois dernier',de:`${pm[0]}-${pad(pm[1])}-01`,a:`${pm[0]}-${pad(pm[1])}-31`},
    {lib:'Ce trimestre',de:`${y}-${pad(q*3+1)}-01`,a:`${y}-${pad(q*3+3)}-31`},{lib:'Trimestre dernier',de:`${pq[0]}-${pad(pq[1]*3+1)}-01`,a:`${pq[0]}-${pad(pq[1]*3+3)}-31`},{lib:'Année '+y,de:`${y}-01-01`,a:`${y}-12-31`}]}
function barre(lib,val,max){const pc=max?Math.min(100,val/max*100):0;const cls=pc>=100?'bad':pc>=80?'warn':'';
  return `<div class="small" style="display:flex;justify-content:space-between;gap:10px"><span>${esc(lib)}</span><span class="muted num">${Math.round(pc)} %</span></div><div class="bar ${cls}"><i style="width:${pc.toFixed(1)}%"></i></div>`}
function vAccueil(){
  titre('');
  const t=today(),y=t.slice(0,4),m=+t.slice(5,7);const P=periodes();const an=encaisse(y+'-01-01',y+'-12-31');const mois=encaisse(P[0].de,P[0].a);
  const aEnc=D.factures.filter(f=>f.statut!=='payee');const retard=aEnc.filter(enRetard);const totAEnc=r2(aEnc.reduce((s,f)=>s+totalDoc(f),0));
  const h0=new Date().getHours();
  let h=`<div class="hello">${h0<18&&h0>=5?'Bonjour':'Bonsoir'}${prenom()?' '+esc(prenom()):''} 👋</div><div class="muted">${D.factures.length||D.devis.length?'Voici où vous en êtes.':'Bienvenue dans Kwik.'}</div>`;
  // Premiers pas
  const etapes=[[entrepriseOk(),'#/bienvenue/1','Préparer mon entreprise','2 minutes, guidé pas à pas : nom, SIRET, logo, CGV'],[D.clients.length>0,'#/client-edit/nouveau','Ajouter un premier client','Particulier ou professionnel'],[D.devis.length+D.factures.length>0,'#/devis-edit/nouveau','Faire mon premier devis','Il se transforme en facture en un geste']];
  if(etapes.some(e=>!e[0]))h+=`<h2>Pour bien démarrer</h2><div class="list steps">${etapes.map((e,i)=>`<a class="item ${e[0]?'done':''}" href="${e[1]}"><span class="av">${e[0]?svg('check'):i+1}</span><span class="grow"><span class="t" style="display:block">${e[2]}</span><span class="s" style="display:block">${e[3]}</span></span>${e[0]?'':svg('chev','i chev')}</a>`).join('')}</div>`;
  const parMois=Array.from({length:12},(_,i)=>encaisse(`${y}-${pad(i+1)}-01`,`${y}-${pad(i+1)}-31`).total);const maxM=Math.max(...parMois,1);
  h+=`<div class="hero"><div class="l">Mon chiffre d'affaires ${y}</div><div class="v">${eur(an.total)}</div>
    <div class="months" aria-hidden="true">${parMois.map((v,i)=>`<div class="${i===m-1?'on':''}"><i style="height:${Math.max(4,Math.round(v/maxM*46))}px"></i><span>${'JFMAMJJASOND'[i]}</span></div>`).join('')}</div>
    <div class="split" style="margin-top:12px"><div class="mark"><b>${eur(totAEnc)}</b><span>À encaisser</span></div><div><b>${eur(mois.total)}</b><span>En ${MOIS[m-1]}</span></div></div></div>`;
  const trim=encaisse(P[2].de,P[2].a);
  if(an.total>0)h+=`<div class="card aside"><span class="em">🐷</span><span style="flex:1;min-width:0"><span class="small muted" style="display:block">À mettre de côté pour l'URSSAF (ce trimestre)</span><b class="big">${eur(trim.cotis)}</b><span class="small muted">Environ ${dec(D.params.tauxVente)} % de vos ventes et ${dec(D.params.tauxService)} % de vos services encaissés.</span></span></div>`;
  h+=`<div class="quick"><a href="#/devis-edit/nouveau"><span class="ic">${svg('devis')}</span>Devis</a><a href="#/facture-edit/nouveau"><span class="ic">${svg('facture')}</span>Facture</a><a href="#/client-edit/nouveau"><span class="ic">${svg('client')}</span>Client</a><a href="#/achat-edit/nouveau"><span class="ic">${svg('achat')}</span>Achat</a></div>`;
  // À faire
  const todos=[];
  retard.sort((a,b)=>a.echeance.localeCompare(b.echeance)).forEach(f=>todos.push(`<a class="todo" href="#/voir/facture/${f.id}" style="text-decoration:none;color:inherit"><span class="dot" style="background:var(--bad)"></span><span style="flex:1;min-width:0"><b>Relancer ${esc(f.client.nom)}</b><br><span class="small muted">${esc(f.numero)} · en retard de ${daysBetween(f.echeance,t)} j</span></span><span class="amount">${eur(totalDoc(f))}</span></a>`));
  D.devis.filter(d=>d.statut==='envoye'&&daysBetween(d.date,t)>=7).forEach(d=>todos.push(`<a class="todo" href="#/voir/devis/${d.id}" style="text-decoration:none;color:inherit"><span class="dot" style="background:var(--warn)"></span><span style="flex:1;min-width:0"><b>Devis sans réponse : ${esc(d.client.nom)}</b><br><span class="small muted">${esc(d.numero)} · envoyé il y a ${daysBetween(d.date,t)} j</span></span><span class="amount">${eur(totalDoc(d))}</span></a>`));
  D.devis.filter(d=>d.statut==='accepte').forEach(d=>todos.push(`<a class="todo" href="#/voir/devis/${d.id}" style="text-decoration:none;color:inherit"><span class="dot" style="background:var(--ok)"></span><span style="flex:1;min-width:0"><b>Facturer ${esc(d.client.nom)}</b><br><span class="small muted">Devis ${esc(d.numero)} accepté</span></span><span class="amount">${eur(totalDoc(d))}</span></a>`));
  const ds=D.derniereSauvegarde;
  if(D.factures.length+D.devis.length&&(!ds||(Date.now()-new Date(ds).getTime())>30*864e5))todos.push(`<a class="todo" href="#/sauvegarde" style="text-decoration:none;color:inherit"><span class="dot" style="background:var(--brand)"></span><span style="flex:1"><b>Sauvegarder mes données</b><br><span class="small muted">${ds?'Dernière sauvegarde le '+fdate(ds.slice(0,10)):'Jamais faite'}</span></span>${svg('chev','i chev')}</a>`);
  if(todos.length)h+=`<h2>À faire</h2><div class="list">${todos.join('')}</div>`;
  // Récents
  const recents=[...D.devis.map(d=>['devis',d]),...D.factures.map(f=>['facture',f])].sort((a,b)=>(b[1].maj||b[1].cree||'').localeCompare(a[1].maj||a[1].cree||'')).slice(0,4);
  if(recents.length)h+=`<h2>Récemment</h2><div class="list">${recents.map(([ty,d])=>ligneDoc(ty,d,true)).join('')}</div>`;
  // URSSAF
  h+=`<details class="card"><summary>Pour ma déclaration URSSAF</summary><div class="scroll"><table class="t"><thead><tr><th>Période</th><th class="n">Ventes</th><th class="n">Services</th><th class="n">Cotisations*</th></tr></thead><tbody>`+
    P.map(p=>{const e=encaisse(p.de,p.a);return `<tr><td>${p.lib}</td><td class="n">${eur(e.vente)}</td><td class="n">${eur(e.service)}</td><td class="n">${eur(e.cotis)}</td></tr>`}).join('')+
    `</tbody></table></div><p class="small muted">* Estimation sur les sommes encaissées, avec ${dec(D.params.tauxVente)} % pour les ventes et ${dec(D.params.tauxService)} % pour les services. Les deux se déclarent sur des lignes séparées. Hors versement libératoire et contribution à la formation.</p></details>`;
  h+=`<details class="card"><summary>Mes plafonds ${y}</summary><div style="margin-top:12px">`+
    barre('Plafond micro (total : '+eur(D.params.plafondVente)+')',an.total,D.params.plafondVente)+
    barre('Plafond micro (services : '+eur(D.params.plafondService)+')',an.service,D.params.plafondService)+
    barre('Franchise de TVA (total : '+eur(D.params.tvaVente)+')',an.total,D.params.tvaVente)+
    barre('Franchise de TVA (services : '+eur(D.params.tvaService)+')',an.service,D.params.tvaService)+
    `<p class="small muted" style="margin:0">Calculé sur l'encaissé de l'année. Au-delà de la franchise, la TVA devient due.</p></div></details>`;
  return h}

/* ============ Listes ============ */
function ligneDoc(type,d,avecType){const cl=d.client||{};
  return `<a class="item" href="#/voir/${type}/${d.id}"><span class="av">${avecType?svg(type):esc(initiales(cl.nom))}</span><span class="grow"><span class="t" style="display:block">${esc(cl.nom||'Sans client')}</span><span class="s" style="display:block">${avecType?(type==='devis'?'Devis ':'Facture ')+'· ':''}${esc(d.numero||'')} · ${fdate(d.date)}</span></span><span class="end"><span class="amount">${eur(totalDoc(d))}</span>${type==='facture'?badgeFacture(d):badgeDevis(d)}</span></a>`}
const tri=arr=>arr.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.numero||'').localeCompare(a.numero||''));
let RECH={devis:'',factures:'',clients:''};
function barreRecherche(cle,ph){return `<div class="search">${svg('search')}<input type="search" placeholder="${ph}" value="${esc(RECH[cle])}" oninput="RECH.${cle}=this.value;App.filtrer('${cle}')" aria-label="${ph}"></div>`}
function filtreTexte(l,q){q=norm(q).trim();if(!q)return l;return l.filter(d=>norm((d.client&&d.client.nom)||d.nom).includes(q)||norm(d.numero).includes(q))}
const FDEVIS={tous:['Tous',()=>true],encours:['En attente',d=>d.statut==='brouillon'||d.statut==='envoye'],acceptes:['Acceptés',d=>d.statut==='accepte'||d.statut==='facture'],refuses:['Refusés',d=>d.statut==='refuse']};
const FFACT={toutes:['Toutes',()=>true],aencaisser:['À encaisser',f=>f.statut!=='payee'],retard:['En retard',enRetard],payees:['Payées',f=>f.statut==='payee']};
function chips(base,cur,F,arr){return `<div class="chips">`+Object.entries(F).map(([k,v])=>`<a class="chip ${cur===k?'on':''}" href="#/${base}/${k}">${v[0]}<span class="n">${arr.filter(v[1]).length}</span></a>`).join('')+`</div>`}
let FILTRE={devis:'tous',factures:'toutes'};
function contenuDevis(){const l=filtreTexte(tri(D.devis).filter(FDEVIS[FILTRE.devis][1]),RECH.devis);
  return l.length?`<div class="list">${l.map(d=>ligneDoc('devis',d)).join('')}</div>`:vide_(D.devis.length?'Aucun devis ne correspond.':'Aucun devis pour l’instant.','devis',D.devis.length?'':`<a class="btn primary" href="#/devis-edit/nouveau">Faire un devis</a>`)}
function contenuFactures(){const l=filtreTexte(tri(D.factures).filter(FFACT[FILTRE.factures][1]),RECH.factures);
  return l.length?`<div class="list">${l.map(d=>ligneDoc('facture',d)).join('')}</div>`:vide_(D.factures.length?'Aucune facture ici.':'Aucune facture pour l’instant.','facture',D.factures.length?'':`<a class="btn primary" href="#/facture-edit/nouveau">Faire une facture</a>`)}
function vide_(t,ic,btn){return `<div class="empty">${svg(ic)}<div>${t}</div>${btn?`<div style="margin-top:14px">${btn}</div>`:''}</div>`}
function vListeDevis(f){FILTRE.devis=FDEVIS[f]?f:'tous';titre('Devis');
  return barreRecherche('devis','Rechercher un client, un numéro')+chips('devis',FILTRE.devis,FDEVIS,D.devis)+`<div id="res">${contenuDevis()}</div>`}
function vListeFactures(f){FILTRE.factures=FFACT[f]?f:'toutes';titre('Factures');
  const aEnc=D.factures.filter(x=>x.statut!=='payee');
  return (aEnc.length?`<div class="kpis"><div class="kpi"><div class="l">À encaisser</div><div class="v">${eur(aEnc.reduce((s,x)=>s+totalDoc(x),0))}</div></div><div class="kpi"><div class="l">Dont en retard</div><div class="v" style="color:var(--bad)">${eur(aEnc.filter(enRetard).reduce((s,x)=>s+totalDoc(x),0))}</div></div></div>`:'')+
    barreRecherche('factures','Rechercher un client, un numéro')+chips('factures',FILTRE.factures,FFACT,D.factures)+`<div id="res">${contenuFactures()}</div>`}

/* ============ Clients ============ */
function contenuClients(){const l=filtreTexte(D.clients.slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr')),RECH.clients);

    :vide_(D.clients.length?'Aucun client ne correspond.':'Votre carnet de clients est vide.','client',D.clients.length?'':`<a class="btn primary" href="#/client-edit/nouveau">Ajouter un client</a>`)}
function vClients(){titre('Clients');return barreRecherche('clients','Rechercher un client')+`<div id="res">${contenuClients()}</div>`}
function formClient(c,suffix){return `

function majTypeClient(sfx){const f=document.querySelector(`#fSiren${sfx}`);const pro=document.querySelector(`#fSiren${sfx}`).closest('form').querySelector('input[name=type][value=pro]').checked;f.hidden=!pro}
function vClientEdit(id){

  return h}

function nouvelleLigne(){return{designation:'',qte:1,unite:'',pu:'',nature:D.entreprise.activite==='service'?'service':'vente'}}
function vEditDoc(type,id){
  const liste=type==='devis'?D.devis:D.factures;const key=id||'nouveau';
  if(!ED||ED._type!==type||ED._id!==key){
    if(key!=='nouveau'){const src=parId(liste,key);if(!src){go('#/'+(type==='devis'?'devis':'factures'));return ''}
      if(type==='facture'&&src.statut==='payee'){toast('Une facture payée ne peut plus être modifiée');go('#/voir/facture/'+key);return ''}
      ED=JSON.parse(JSON.stringify(src))}
    else{const t=today();ED={id:'',date:t,clientId:'',lignes:[nouvelleLigne()],notes:''};
      if(type==='devis')ED.validite=addDays(t,30);else{ED.dateExecution=t;ED.echeance=addDays(t,num(D.entreprise.delai)||30)}}
    ED._type=type;ED._id=key}
  const isF=type==='facture';
  titre(ED.id?ED.numero:(isF?'Nouvelle facture':'Nouveau devis'),()=>{ED=null;history.length>1?history.back():go('#/accueil')},'');
  let h='';
  if(!entrepriseOk())h+=`<div class="alert info">Votre fiche entreprise est incomplète. <a href="#/entreprise">La remplir</a></div>`;
  if(isF&&ED.numero)h+=`<div class="alert">Si cette facture a déjà été envoyée au client, mieux vaut ne plus la modifier.</div>`;
  if(!ED.id&&!ED.devisId)h+=`<div class="seg big" role="radiogroup" aria-label="Type de document"><label><input type="radio" name="dtype" ${!isF?'checked':''} onchange="App.basculer('devis')"><span>Devis</span></label><label><input type="radio" name="dtype" ${isF?'checked':''} onchange="App.basculer('facture')"><span>Facture</span></label></div>`;
  h+=`<div class="eyebrow" style="margin:6px 0 8px">Client</div><div id="pick">${pickerHtml()}</div>
  <div class="eyebrow" style="margin:20px 0 8px">Ce que vous facturez</div><div id="lignes">${lignesHtml()}</div>
  <div class="add-row"><button class="btn" onclick="App.ajLigne()">+ Ligne</button>${D.produits.length?`<button class="btn" onclick="App.sheetCatalogue()">+ Catalogue</button>`:''}</div>
  <details class="card"><summary>Dates${isF?' et échéance':' et validité'}</summary><div style="margin-top:12px">
    <div class="grid2"><label class="f">Date ${isF?'de la facture':'du devis'}<input type="date" value="${ED.date}" onchange="App.edDate(this.value)"></label>
    ${isF?`<label class="f">Date des travaux / livraison<input type="date" value="${ED.dateExecution||''}" onchange="ED.dateExecution=this.value"></label>`:`<label class="f">Valable jusqu'au<input type="date" id="edValid" value="${ED.validite||''}" onchange="ED.validite=this.value"></label>`}</div>
    ${isF?`<label class="f" style="margin:0">À payer au plus tard le<input type="date" id="edEch" value="${ED.echeance||''}" onchange="ED.echeance=this.value"></label>`:''}
  </div></details>
  <details class="card" ${ED.notes?'open':''}><summary>Note pour le client</summary><label class="f" style="margin:12px 0 0"><textarea oninput="ED.notes=this.value" placeholder="Ex. : délai d'intervention, conditions particulières">${esc(ED.notes)}</textarea></label></details>
  <p class="small muted">TVA non applicable (franchise en base) : les montants sont nets.</p>`;
  AFTER=()=>{actionbar(`<div class="tot"><span class="small muted">Total</span><b id="edTotal">${eur(totalDoc(ED))}</b></div><button class="btn primary" onclick="App.sauverDoc()">${svg('check')} Enregistrer</button>`);
    if(!ED.id&&!ED.clientId&&D.clients.length&&!ED._auto){ED._auto=true;App.sheetClients()}};
  return h}

   :`<button class="picker" onclick="App.sheetClients()"><span class="grow"><b style="color:var(--brand);display:block">Choisir un client</b><span class="small muted">Dans votre liste, ou en ajouter un nouveau</span></span></button>`}
function lignesHtml(){return ED.lignes.map((l,i)=>`<div class="ligne">

    <div class="pu"><span class="lab">Prix unitaire (€)</span><input class="mini" inputmode="decimal" value="${esc(dec(l.pu))}" placeholder="0,00" oninput="ED.lignes[${i}].pu=this.value;App.majTotaux()" aria-label="Prix unitaire"></div>
  </div>
  <div class="foot"><select onchange="ED.lignes[${i}].nature=this.value" aria-label="Type">${optNature(l.nature)}</select><span class="lt" id="lt${i}">${eur(num(l.qte)*num(l.pu))}</span></div>
</div>`).join('')}

/* ============ Aperçu document ============ */

/* ============ Actions ============ */
function formData(ev){ev.preventDefault();const o={};new FormData(ev.target).forEach((v,k)=>{o[k]=typeof v==='string'?v.trim():v});return o}
function telecharger(nom,contenu,type){const blob=new Blob([contenu],{type});
  const file=typeof File==='function'?new File([blob],nom,{type}):null;
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){navigator.share({files:[file],title:nom}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nom;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function csv(lignes){return '﻿'+lignes.map(l=>l.map(v=>{v=typeof v==='number'?dec(v):String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n')}
function messageDoc(type,d){const e=D.entreprise;const c=d.client||{};const nom=c.type==='pro'?'':(c.nom||'').replace(/^(M\.|Mme|Monsieur|Madame)\s+/i,'');
  if(type==='devis')return `Bonjour${nom?' '+nom:''},\n\nVoici mon devis ${d.numero} d'un montant de ${eur(totalDoc(d))}, valable jusqu'au ${fdate(d.validite)}.\n\nN'hésitez pas si vous avez des questions.\n\n${e.prenomNom||''}${e.tel?'\n'+e.tel:''}`;
  if(enRetard(d))return `Bonjour${nom?' '+nom:''},\n\nSauf erreur de ma part, la facture ${d.numero} de ${eur(totalDoc(d))}, arrivée à échéance le ${fdate(d.echeance)}, n'a pas encore été réglée.\n\nMerci de bien vouloir procéder au paiement${e.iban?' par virement (IBAN '+e.iban+')':''}.\n\nBien cordialement,\n${e.prenomNom||''}${e.tel?'\n'+e.tel:''}`;
  return `Bonjour${nom?' '+nom:''},\n\nVoici ma facture ${d.numero} d'un montant de ${eur(totalDoc(d))}, à régler avant le ${fdate(d.echeance)}${e.iban?' par virement (IBAN '+e.iban+')':''}.\n\nMerci !\n${e.prenomNom||''}${e.tel?'\n'+e.tel:''}`}

function confettis(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#FFD23F','#2B3FD6','#2E7556','#F7A46B','#D29BE3','#6ED69A'];

function modeleCgv(type){const e=D.entreprise;const qui=`${e.prenomNom||'[Prénom Nom]'} EI${e.nomCommercial?' ('+e.nomCommercial+')':''}, ${e.adresse||'[adresse]'} ${e.cp||''} ${e.ville||''}, SIRET ${e.siret||'[SIRET]'}${e.email?', '+e.email:''}${e.tel?', '+e.tel:''}`.replace(/\s+/g,' ');
  const metier=e.metier?e.metier.toLowerCase():'';
  if(type==='service')return `1. Vendeur
Les présentes conditions générales de vente (CGV) s'appliquent aux prestations réalisées par ${qui}${metier?', '+metier:''}.

2. Devis et commande
Toute prestation fait l'objet d'un devis gratuit, valable pendant la durée indiquée. La commande est ferme dès réception du devis daté et signé avec la mention « Bon pour accord ». Un acompte de [30] % peut être demandé à la signature.

3. Prix
Les prix sont indiqués en euros. TVA non applicable, art. 293 B du CGI. Les travaux supplémentaires non prévus au devis feront l'objet d'un avenant accepté par le client.

Le solde est payable à la date indiquée sur la facture, par virement, chèque ou espèces (dans la limite légale). Pour les clients professionnels, tout retard entraîne des pénalités au taux de trois fois le taux d'intérêt légal et une indemnité forfaitaire de 40 € pour frais de recouvrement.

6. Droit de rétractation (particuliers)
Si le contrat est conclu à distance ou hors établissement (au domicile du client), le client particulier dispose de 14 jours pour se rétracter, sans justification. S'il demande que la prestation commence avant la fin de ce délai, il paiera la part déjà réalisée. Le droit de rétractation ne s'applique plus à une prestation entièrement exécutée avec son accord.

7. Garanties et responsabilité
Le vendeur s'engage à réaliser les prestations avec soin et selon les règles de l'art. ${e.assurance?'Assurance professionnelle : '+e.assurance+'.':'[Indiquer ici votre assurance professionnelle si vous en avez une.]'}

8. Données personnelles
Les coordonnées du client servent uniquement à la gestion des devis, factures et du suivi. Elles ne sont jamais revendues. Le client peut demander à les consulter ou les supprimer.

9. Médiation et litiges
En cas de litige, le client particulier peut recourir gratuitement au médiateur de la consommation : [nom et site du médiateur]. Le droit français s'applique.`;
  return `1. Vendeur
Les présentes conditions générales de vente (CGV) s'appliquent aux ventes de créations${metier?' ('+metier+')':''} réalisées par ${qui}, sur un marché, en atelier, à distance ou sur commande.

2. Les créations
Chaque pièce est faite à la main. De légères différences de forme, de taille, de couleur ou d'émail par rapport aux photos ou aux exemples sont normales : elles ne sont pas des défauts. [Préciser l'usage : pièces aptes au contact alimentaire, lave-vaisselle et micro-ondes oui ou non, éviter les chocs thermiques.]

3. Commandes sur mesure
Une pièce personnalisée fait l'objet d'un devis. La commande est ferme dès signature du devis et versement d'un acompte de [30] %, non remboursable une fois la fabrication commencée. Le délai de fabrication est indiqué sur le devis, à titre indicatif.

4. Prix
Les prix sont en euros. TVA non applicable, art. 293 B du CGI. Les frais d'envoi éventuels sont indiqués avant la commande et restent à la charge du client.

Paiement comptant au retrait ou à l'envoi, par virement, carte, chèque ou espèces (dans la limite légale). Les créations restent la propriété du vendeur jusqu'au paiement complet. Pour les clients professionnels, tout retard entraîne des pénalités au taux de trois fois le taux d'intérêt légal et une indemnité forfaitaire de 40 € pour frais de recouvrement.

6. Retrait et livraison
Les pièces sont soigneusement emballées. Pour un client particulier, les risques sont transférés au moment où il reçoit le colis. En cas de casse à la réception, le client le signale dans les 3 jours avec des photos, pour un remplacement ou un remboursement.

7. Droit de rétractation (achats à distance)
Pour un achat à distance (internet, téléphone, réseaux sociaux), le client particulier dispose de 14 jours après réception pour se rétracter, sans justification. Il renvoie la pièce intacte à ses frais, et il est remboursé sous 14 jours. Ce droit ne s'applique pas aux pièces réalisées sur mesure ou personnalisées, ni aux achats faits sur place (marché, atelier).

Le client particulier bénéficie de la garantie légale de conformité (articles L217-3 et suivants du Code de la consommation) pendant 2 ans à compter de la remise de la pièce, et de la garantie des vices cachés (articles 1641 et suivants du Code civil). Une casse due à une chute, un choc ou un usage non conseillé n'est pas couverte.

9. Propriété des créations
Les modèles, photos et motifs restent la propriété du vendeur et ne peuvent être reproduits sans son accord.

  sheetCatalogue(){openSheet(`<h3>Ajouter depuis le catalogue</h3><div class="list">${D.produits.slice().sort((a,b)=>a.designation.localeCompare(b.designation,'fr')).map(p=>`<button class="item" onclick="App.ajProduit('${p.id}')"><span class="grow"><span class="t" style="display:block">${esc(p.designation)}</span><span class="s" style="display:block">${p.unite?'par '+esc(p.unite):''}</span></span><span class="amount">${eur(p.pu)}</span></button>`).join('')}</div>`)},
  edDate(v){const ancien=ED.date;ED.date=v;
    if(ED._type==='devis'){if(!ED.validite||ED.validite===addDays(ancien,30)){ED.validite=addDays(v,30);const el=$('#edValid');if(el)el.value=ED.validite}}
    else{const del=num(D.entreprise.delai)||30;if(!ED.echeance||ED.echeance===addDays(ancien,del)){ED.echeance=addDays(v,del);const el=$('#edEch');if(el)el.value=ED.echeance}if(!ED.dateExecution||ED.dateExecution===ancien)ED.dateExecution=v}},
  majTotaux(){ED.lignes.forEach((l,i)=>{const el=$('#lt'+i);if(el)el.textContent=eur(num(l.qte)*num(l.pu))});const t=$('#edTotal');if(t)t.textContent=eur(totalDoc(ED))},
  pas(i,d){const l=ED.lignes[i];l.qte=Math.max(0,r2(num(l.qte)+d));$('#q'+i).value=dec(l.qte);App.majTotaux()},
  ajLigne(){ED.lignes.push(nouvelleLigne());$('#lignes').innerHTML=lignesHtml();App.majTotaux();const ins=$('#lignes').querySelectorAll('.des');ins[ins.length-1].focus()},
  ajProduit(id){const p=parId(D.produits,id);if(!p)return;const l={designation:p.designation,qte:1,unite:p.unite||'',pu:p.pu,nature:p.nature};
    if(ED.lignes.length===1&&!ED.lignes[0].designation&&!num(ED.lignes[0].pu))ED.lignes[0]=l;else ED.lignes.push(l);$('#lignes').innerHTML=lignesHtml();App.majTotaux();closeSheet();toast('Ajouté : '+p.designation)},
  supLigne(i){ED.lignes.splice(i,1);$('#lignes').innerHTML=lignesHtml();App.majTotaux()},
  async sauverDoc(){const type=ED._type;const liste=type==='devis'?D.devis:D.factures;
    const cl=parId(D.clients,ED.clientId);if(!cl){toast('Choisissez un client');App.sheetClients();return}
    const lignes=ED.lignes.filter(l=>String(l.designation).trim()||num(l.pu));
    if(!lignes.length){toast('Ajoutez au moins une ligne');return}
    if(lignes.some(l=>!String(l.designation).trim())){toast('Chaque ligne doit avoir une désignation');return}
    if(type==='facture'&&!entrepriseOk()&&!await ask('Fiche entreprise incomplète','Votre nom, SIRET ou adresse manque. Ils sont obligatoires sur une facture.','Enregistrer quand même'))return;
    const doc=JSON.parse(JSON.stringify(ED));delete doc._type;delete doc._id;delete doc._auto;
    doc.lignes=lignes.map(l=>({designation:String(l.designation).trim(),qte:num(l.qte),unite:l.unite||'',pu:r2(num(l.pu)),nature:l.nature==='vente'?'vente':'service'}));
    doc.client={nom:cl.nom,type:cl.type,siren:cl.siren,adresse:cl.adresse,cp:cl.cp,ville:cl.ville,email:cl.email};doc.maj=new Date().toISOString();
    if(!doc.id){doc.id=uid();doc.cree=doc.maj;doc.numero=prochainNumero(type,doc.date);
      if(type==='devis')doc.statut='brouillon';else{doc.statut='emise';doc.emetteur=Object.assign({},D.entreprise)}
      liste.push(doc);
      if(type==='facture'&&doc.devisId){const dv=parId(D.devis,doc.devisId);if(dv){dv.statut='facture';dv.factureId=doc.id;dv.maj=doc.maj}}}
    else{const i=liste.findIndex(x=>x.id===doc.id);if(type==='facture')doc.emetteur=Object.assign({},D.entreprise);liste[i]=doc}
    if(enregistrer()){ED=null;const premier=liste.length===1;toast(premier?(type==='devis'?'🎉 Votre premier devis !':'🎉 Votre première facture !'):(type==='devis'?'Devis enregistré':'Facture enregistrée'));if(premier)confettis();go('#/voir/'+type+'/'+doc.id)}},
  statutDevis(id,s){const d=parId(D.devis,id);d.statut=s;d.maj=new Date().toISOString();enregistrer();route()},
  devisVersFacture(id){const d=parId(D.devis,id);const t=today();
    ED={id:'',date:t,dateExecution:t,echeance:addDays(t,num(D.entreprise.delai)||30),clientId:d.clientId,lignes:JSON.parse(JSON.stringify(d.lignes)),notes:d.notes||'',devisId:d.id,_type:'facture',_id:'nouveau'};
    if(!parId(D.clients,d.clientId))toast('Le client de ce devis a été supprimé : choisissez-en un');
    go('#/facture-edit/nouveau')},
  dupliquer(type,id){closeSheet();const src=parId(type==='devis'?D.devis:D.factures,id);const t=today();
    ED={id:'',date:t,clientId:src.clientId,lignes:JSON.parse(JSON.stringify(src.lignes)),notes:src.notes||'',_type:type,_id:'nouveau'};
    if(type==='devis')ED.validite=addDays(t,30);else{ED.dateExecution=t;ED.echeance=addDays(t,num(D.entreprise.delai)||30)}
    go('#/'+type+'-edit/nouveau')},
  sheetActions(type,id){const d=parId(type==='devis'?D.devis:D.factures,id);const isF=type==='facture';
    openSheet(`<h3>${esc(d.numero)}</h3><div class="list">
      <button class="item" onclick="closeSheet();App.imprimer('${type}','${id}')"><span class="av">${svg('pdf')}</span><span class="grow t">PDF / Imprimer</span></button>
      <button class="item" onclick="closeSheet();App.partager('${type}','${id}')"><span class="av">${svg('share')}</span><span class="grow t">${isF&&enRetard(d)?'Relancer le client':'Envoyer un message'}</span></button>
      <button class="item" onclick="App.dupliquer('${type}','${id}')"><span class="av">${svg('copy')}</span><span class="grow t">Dupliquer</span></button>
      ${isF&&d.statut==='payee'?`<button class="item" onclick="App.annulerPaiement('${id}')"><span class="av">${svg('x')}</span><span class="grow t">Annuler l'encaissement</span></button>`:''}
      ${!isF?`<button class="item" onclick="App.supprimerDevis('${id}')" style="color:var(--bad)"><span class="av" style="background:var(--bad-soft);color:var(--bad)">${svg('trash')}</span><span class="grow t">Supprimer le devis</span></button>`:''}
    </div>${isF?'<p class="small muted">Une facture ne peut pas être supprimée : la loi impose une numérotation sans trou.</p>':''}`)},
  async supprimerDevis(id){closeSheet();await new Promise(r=>setTimeout(r,260));if(!await ask('Supprimer ce devis ?','','Supprimer',true))return;D.devis=D.devis.filter(d=>d.id!==id);enregistrer();toast('Devis supprimé');go('#/devis')},
  sheetPayer(id){const f=parId(D.factures,id);
    openSheet(`<h3>Encaisser ${eur(totalDoc(f))}</h3><p class="muted" style="margin-top:-6px">${esc(f.client.nom)} · ${esc(f.numero)}</p>
    <label class="f">Payée le<input type="date" id="pDate" value="${today()}"></label>
    <div class="f"><span style="font-size:13.5px;font-weight:600;color:var(--muted)">Moyen de paiement</span><div class="chips" style="margin-top:8px;flex-wrap:wrap" id="pModes">${['virement','espèces','chèque','carte bancaire','autre'].map((m,i)=>`<button type="button" class="chip ${i===0?'on':''}" onclick="document.querySelectorAll('#pModes .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${m}</button>`).join('')}</div></div>
    <button class="btn hi block" onclick="App.payer('${id}')">${svg('check')} Confirmer l'encaissement</button>`)},
  payer(id){const f=parId(D.factures,id);const date=$('#pDate').value||today();const m=document.querySelector('#pModes .chip.on');f.statut='payee';f.paiement={date,mode:m?m.textContent:'virement'};f.maj=new Date().toISOString();enregistrer();closeSheet();toast('💶 '+eur(totalDoc(f))+' encaissés !');confettis();route()},
  async annulerPaiement(id){closeSheet();await new Promise(r=>setTimeout(r,260));if(!await ask("Annuler l'encaissement ?",'La facture repassera « à encaisser » et sortira du livre des recettes.','Annuler l’encaissement',true))return;const f=parId(D.factures,id);f.statut='emise';delete f.paiement;enregistrer();route()},
  async partager(type,id){const d=parId(type==='devis'?D.devis:D.factures,id);const txt=messageDoc(type,d);
    if(type==='devis'&&d.statut==='brouillon'){d.statut='envoye';d.maj=new Date().toISOString();enregistrer()}
    if(navigator.share){try{await navigator.share({text:txt});route();return}catch(e){if(e&&e.name==='AbortError'){route();return}}}
    openSheet(`<h3>Message à envoyer</h3><p class="small muted" style="margin-top:-6px">Copiez-le, puis collez-le dans un SMS, WhatsApp ou un mail, avec le PDF.</p><textarea class="field" id="msgTxt" style="min-height:200px">${esc(txt)}</textarea><div style="height:10px"></div><button class="btn primary block" onclick="App.copier()">${svg('copy')} Copier le message</button>`)},
  async copier(){const t=$('#msgTxt');try{await navigator.clipboard.writeText(t.value);toast('Message copié')}catch(e){t.select();toast('Sélectionné : faites Copier')}},
  imprimer(type,id){const d=parId(type==='devis'?D.devis:D.factures,id);$('#print').innerHTML=docHtml(type,d);
    const ancien=document.title;const cl=(d.client&&d.client.nom||'').replace(/[^\w\- ]+/g,'').trim();document.title=(type==='devis'?'Devis ':'Facture ')+d.numero+(cl?' '+cl:'');
    const fin=()=>{document.title=ancien;window.removeEventListener('afterprint',fin)};window.addEventListener('afterprint',fin);
    setTimeout(()=>{try{window.print()}catch(e){toast('Impression impossible ici')}setTimeout(fin,4000)},50)},
  sauverEntreprise(ev){const o=formData(ev);['tauxVente','tauxService','plafondVente','plafondService','tvaVente','tvaService'].forEach(k=>{D.params[k]=num(o[k])||PARAMS_DEFAUT[k];delete o[k]});o.delai=Math.max(0,Math.round(num(o.delai)));o.cgvDevis=!!o.cgvDevis;o.cgvFacture=!!o.cgvFacture;
    Object.assign(D.entreprise,o);enregistrer();toast('Fiche enregistrée');go('#/accueil')},
  paramsDefaut(){D.params=Object.assign({},PARAMS_DEFAUT);enregistrer();route();toast('Valeurs 2026 remises')},
  logo(input,wz){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
      const max=400;const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);D.entreprise.logo=c.toDataURL('image/png');
      if(D.entreprise.logo.length>300000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);D.entreprise.logo=c.toDataURL('image/jpeg',.85)}
      enregistrer();if(!wz)$('#logoPrev').innerHTML=`<img src="${D.entreprise.logo}" style="max-height:60px;max-width:160px"> <button type="button" class="btn sm ghost" onclick="App.retirerLogo()">Retirer</button>`;toast('Logo ajouté');if(wz){const a=$('#wzApercu');if(a)a.innerHTML=miniDoc()}};img.src=r.result};r.readAsDataURL(f)},
  retirerLogo(){D.entreprise.logo='';enregistrer();$('#logoPrev').innerHTML=''},
  csvRecettes(y){const rows=[['Date encaissement','N° facture','Client','Nature','Montant ventes','Montant services','Total','Moyen de paiement']];
    recettes(y).forEach(f=>{const p=partsDoc(f);rows.push([fdate(f.paiement.date),f.numero,f.client.nom,natureOperation(f),p.vente,p.service,totalDoc(f),f.paiement.mode])});telecharger('livre-des-recettes-'+y+'.csv',csv(rows),'text/csv')},
  csvAchats(y){const rows=[['Date','Fournisseur','Objet','Montant','Moyen de paiement','N° pièce']];
    D.achats.filter(a=>a.date.startsWith(y)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(a=>rows.push([fdate(a.date),a.fournisseur,a.objet,num(a.montant),a.mode,a.piece]));telecharger('registre-des-achats-'+y+'.csv',csv(rows),'text/csv')},
  exporter(){D.derniereSauvegarde=new Date().toISOString();enregistrer();telecharger('kwik-sauvegarde-'+today()+'.json',JSON.stringify(Object.assign({app:'Kwik',version:1},D),null,1),'application/json');route()},
  importer(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{let d;try{d=JSON.parse(r.result);if(!d||!Array.isArray(d.factures)||!Array.isArray(d.clients))throw 0}catch(e){info('Fichier non reconnu',"Ce fichier n'est pas une sauvegarde Kwik.");input.value='';return}
      if(!await ask('Restaurer cette sauvegarde ?',`${d.factures.length} factures, ${(d.devis||[]).length} devis et ${d.clients.length} clients remplaceront les données de ce téléphone.`,'Restaurer',true)){input.value='';return}
      delete d.app;delete d.version;D=fusion(d);enregistrer();toast('Sauvegarde restaurée');go('#/accueil')};r.readAsText(f)},
  async toutEffacer(){if(!await ask('Tout effacer ?','Toutes les données de ce téléphone seront supprimées.','Continuer',true))return;await new Promise(r=>setTimeout(r,260));if(!await ask('Vraiment tout effacer ?','Cette action est définitive.','Tout effacer',true))return;D=vide();enregistrer();toast('Données effacées');go('#/accueil')}
};
appliquerApparence();
window.App=App;window.majTypeClient=majTypeClient;window.closeSheet=closeSheet;window.sheetMenu=sheetMenu;
if(!D.onboarded&&!entrepriseOk()&&!D.factures.length&&!D.devis.length&&!/bienvenue/.test(location.hash))location.replace('#/bienvenue/1');
route();
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.self===window.top){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
