<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kwik</title>
<meta name="description" content="Devis, factures et comptabilité simple pour micro-entrepreneurs.">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kwik">
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#18211e; --muted:#5d6b66; --line:#dde3e0;
  --brand:#1f6f5c; --brand-ink:#ffffff; --brand-soft:#e3f1ec;
  --warn:#9a5b00; --warn-soft:#fdf1dc; --bad:#b3261e; --bad-soft:#fce8e6; --ok:#1e7a3c; --ok-soft:#e3f4e8;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --card:#1a2120; --ink:#e7eeeb; --muted:#9aa9a3; --line:#2c3633;
    --brand:#4fb79b; --brand-ink:#08110e; --brand-soft:#16302a;
    --warn:#f0b65a; --warn-soft:#3a2c12; --bad:#f2867e; --bad-soft:#3b1a18; --ok:#6fd08e; --ok-soft:#14301d;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --card:#1a2120; --ink:#e7eeeb; --muted:#9aa9a3; --line:#2c3633;
  --brand:#4fb79b; --brand-ink:#08110e; --brand-soft:#16302a;
  --warn:#f0b65a; --warn-soft:#3a2c12; --bad:#f2867e; --bad-soft:#3b1a18; --ok:#6fd08e; --ok-soft:#14301d;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{background:none;border:0;color:inherit;font-size:22px;padding:0 6px 0 0;cursor:pointer;line-height:1}
main{max-width:680px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;text-align:center;padding:8px 2px 9px;font-size:12px;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:var(--brand);font-weight:600}
h2{font-size:17px;margin:22px 0 10px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;color:var(--ink);min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btns .btn{flex:1 1 140px}
.list a.item,.list div.item{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.list .item:last-child{border-bottom:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amount{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;font-weight:600}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.grey{background:var(--bg);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.chip{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
label.f{display:block;margin-bottom:12px;font-size:14px;color:var(--muted)}
label.f input,label.f select,label.f textarea,.ligne input,.ligne select{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;min-height:44px}
label.f textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:0 8px}
.ligne{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--card)}
.ligne label{font-size:13px;color:var(--muted);display:block;margin-top:8px}
.ligne .bottom{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.ligne .bottom select{flex:1}
.ligne .lt{font-weight:600;padding:0 4px 10px;white-space:nowrap}
.x{border:0;background:none;color:var(--bad);font-size:14px;cursor:pointer;padding:10px 4px}
.total-bar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:12px;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.total-bar .grow{font-size:18px;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.bar{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--brand)}
.bar.warn i{background:var(--warn)}
.bar.bad i{background:var(--bad)}
.alert{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--brand-soft);color:var(--brand)}
.alert a{color:inherit;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.paper-wrap{overflow:hidden;margin:0 0 12px}
.paper{background:#fff;color:#111;border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.15);padding:24px;width:640px;transform-origin:top left}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
#print{display:none}
/* Document (aperçu + impression) */
.doc{font:12.5px/1.4 "Helvetica Neue",Arial,sans-serif;color:#111}
.doc .hd{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}
.doc .logo{max-width:150px;max-height:70px;display:block;margin-bottom:8px}
.doc .em b{font-size:14px}
.doc .ti{text-align:right}
.doc .ti h3{margin:0 0 6px;font-size:22px;letter-spacing:.5px;color:#1f6f5c}
.doc .cl{margin:0 0 18px auto;width:48%;border:1px solid #ccc;border-radius:6px;padding:10px}
.doc table{width:100%;border-collapse:collapse;margin-top:6px}
.doc th{background:#eef3f1;text-align:left;padding:7px 6px;font-size:11.5px;border-bottom:1px solid #bbb}
.doc td{padding:7px 6px;border-bottom:1px solid #e2e2e2;vertical-align:top}
.doc .n{text-align:right;white-space:nowrap}
.doc .tot{margin:12px 0 0 auto;width:50%}
.doc .tot div{display:flex;justify-content:space-between;padding:4px 6px}
.doc .tot .big{font-size:15px;font-weight:700;border-top:2px solid #111;margin-top:4px;padding-top:8px}
.doc .mentions{margin-top:22px;font-size:11px;color:#333;border-top:1px solid #ddd;padding-top:10px}
.doc .mentions p{margin:3px 0}
.doc .sign{margin-top:20px;display:flex;justify-content:flex-end}
.doc .sign div{border:1px solid #bbb;border-radius:6px;width:55%;height:95px;padding:8px;font-size:11px}
.doc .paid{display:inline-block;border:2px solid #1e7a3c;color:#1e7a3c;padding:4px 10px;border-radius:6px;font-weight:700;margin-top:8px}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .top,.tabs,main,#toast{display:none!important}
  #print{display:block}
}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}.grid3 label:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top"><button class="back" id="back" aria-label="Retour" hidden>‹</button><h1 id="titre">Kwik</h1></header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <a href="#/accueil" data-r="accueil"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a>
  <a href="#/devis" data-r="devis"><svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>Devis</a>
  <a href="#/factures" data-r="factures"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Factures</a>
  <a href="#/clients" data-r="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>Clients</a>
  <a href="#/plus" data-r="plus"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Plus</a>
</nav>
<div id="print"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============ Outils ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const EUR=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const eur=n=>EUR.format(+n||0);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const r2=n=>Math.round((+n||0)*100)/100;
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const fdate=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ============ Données ============ */
const KEY='kwik_v1';
const PARAMS_DEFAUT={tauxVente:12.3,tauxService:21.2,plafondVente:203100,plafondService:83600,tvaVente:85000,tvaService:37500};
function vide(){return{
  entreprise:{prenomNom:'',nomCommercial:'',siret:'',adresse:'',cp:'',ville:'',email:'',tel:'',activite:'service',logo:'',iban:'',bic:'',delai:30,assurance:'',mentionLibre:''},
  clients:[],produits:[],devis:[],factures:[],achats:[],compteurs:{},params:Object.assign({},PARAMS_DEFAUT),derniereSauvegarde:''}}
function charger(){
  try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);const v=vide();
    const out=Object.assign(v,d);out.entreprise=Object.assign(vide().entreprise,d.entreprise||{});out.params=Object.assign({},PARAMS_DEFAUT,d.params||{});return out}}catch(e){}
  return vide()}
let D=charger();
function enregistrer(){try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){alert("Impossible d'enregistrer sur ce téléphone (mémoire pleine ou navigation privée). Faites une sauvegarde depuis Plus › Sauvegarde.");return false}}
const parId=(arr,id)=>arr.find(x=>x.id===id);
function prochainNumero(type,dateIso){const y=(dateIso||today()).slice(0,4);const k=type+y;const n=(D.compteurs[k]||0)+1;D.compteurs[k]=n;return (type==='facture'?'F':'D')+y+'-'+String(n).padStart(type==='facture'?4:3,'0')}
const totalDoc=doc=>r2((doc.lignes||[]).reduce((s,l)=>s+num(l.qte)*num(l.pu),0));
function partsDoc(doc){const p={vente:0,service:0};(doc.lignes||[]).forEach(l=>{p[l.nature==='vente'?'vente':'service']+=num(l.qte)*num(l.pu)});p.vente=r2(p.vente);p.service=r2(p.service);return p}
function natureOperation(doc){const p=partsDoc(doc);if(p.vente&&p.service)return 'Livraison de biens et prestation de services';if(p.vente)return 'Livraison de biens';return 'Prestation de services'}
const enRetard=f=>f.statut!=='payee'&&f.echeance&&f.echeance<today();
function badgeFacture(f){if(f.statut==='payee')return '<span class="badge ok">Payée</span>';if(enRetard(f))return '<span class="badge bad">En retard</span>';return '<span class="badge warn">À encaisser</span>'}
const STATUTS_DEVIS={brouillon:['Brouillon','grey'],envoye:['Envoyé','warn'],accepte:['Accepté','ok'],refuse:['Refusé','bad'],facture:['Facturé','']};
function badgeDevis(d){const s=STATUTS_DEVIS[d.statut]||STATUTS_DEVIS.brouillon;return `<span class="badge ${s[1]}">${s[0]}</span>`}
const entrepriseOk=()=>!!(D.entreprise.prenomNom&&D.entreprise.siret&&D.entreprise.adresse);

function encaisse(de,a){const r={vente:0,service:0,nb:0};
  D.factures.forEach(f=>{if(f.statut==='payee'&&f.paiement&&f.paiement.date>=de&&f.paiement.date<=a){const p=partsDoc(f);r.vente+=p.vente;r.service+=p.service;r.nb++}});
  r.vente=r2(r.vente);r.service=r2(r.service);r.total=r2(r.vente+r.service);
  r.cotis=r2(r.vente*D.params.tauxVente/100+r.service*D.params.tauxService/100);return r}

/* ============ Routeur ============ */
let ED=null; // document en cours de modification
let RETOUR_CLIENT=null;
function go(h){location.hash=h}
function titre(t,retour){$('#titre').textContent=t;const b=$('#back');if(retour){b.hidden=false;b.onclick=()=>{if(typeof retour==='string')go(retour);else history.back()}}else b.hidden=true}
function route(){
  const parts=(location.hash.replace(/^#\/?/,'')||'accueil').split('/');
  const r=parts[0];const main=$('#main');
  const onglet={accueil:'accueil',devis:'devis','devis-edit':'devis',factures:'factures','facture-edit':'factures',voir:parts[1]==='devis'?'devis':'factures',clients:'clients','client-edit':'clients'}[r]||'plus';
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.r===onglet));
  const V={accueil:vAccueil,devis:vListeDevis,factures:vListeFactures,clients:vClients,'client-edit':vClientEdit,plus:vPlus,catalogue:vCatalogue,'produit-edit':vProduitEdit,achats:vAchats,'achat-edit':vAchatEdit,recettes:vRecettes,entreprise:vEntreprise,sauvegarde:vSauvegarde,'devis-edit':p=>vEditDoc('devis',p),'facture-edit':p=>vEditDoc('facture',p),voir:(p,q)=>vVoir(p,q),aide:vAide}[r]||vAccueil;
  main.innerHTML=V(parts[1],parts.slice(2).join('/'))||'';
  window.scrollTo(0,0);
  if(V.after)V.after();
  if(typeof AFTER==='function'){const f=AFTER;AFTER=null;f()}
}
let AFTER=null;
window.addEventListener('hashchange',route);

/* ============ Accueil ============ */
function periodes(){const t=today();const y=+t.slice(0,4),m=+t.slice(5,7);const pm=m===1?[y-1,12]:[y,m-1];const q=Math.floor((m-1)/3);
  const pq=q===0?[y-1,3]:[y,q-1];
  return[
    {lib:'Ce mois-ci',de:`${y}-${pad(m)}-01`,a:`${y}-${pad(m)}-31`},
    {lib:'Mois dernier',de:`${pm[0]}-${pad(pm[1])}-01`,a:`${pm[0]}-${pad(pm[1])}-31`},
    {lib:'Ce trimestre',de:`${y}-${pad(q*3+1)}-01`,a:`${y}-${pad(q*3+3)}-31`},
    {lib:'Trimestre dernier',de:`${pq[0]}-${pad(pq[1]*3+1)}-01`,a:`${pq[0]}-${pad(pq[1]*3+3)}-31`},
    {lib:'Année '+y,de:`${y}-01-01`,a:`${y}-12-31`}]}
function barre(lib,val,max){const pc=max?Math.min(100,val/max*100):0;const cls=pc>=100?'bad':pc>=80?'warn':'';
  return `<div class="small">${esc(lib)} <span class="muted">· ${eur(val)} sur ${eur(max)}</span></div><div class="bar ${cls}"><i style="width:${pc.toFixed(1)}%"></i></div>`}
function vAccueil(){
  titre('Kwik');
  const y=today().slice(0,4);const P=periodes();const an=encaisse(y+'-01-01',y+'-12-31');const mois=encaisse(P[0].de,P[0].a);
  const aEnc=D.factures.filter(f=>f.statut!=='payee');const retard=aEnc.filter(enRetard);
  let h='';
  if(!entrepriseOk())h+=`<div class="alert info">Bienvenue ! Commencez par remplir <a href="#/entreprise">votre fiche entreprise</a> : elle apparaît sur vos devis et factures.</div>`;
  if(retard.length)h+=`<div class="alert bad">${retard.length} facture${retard.length>1?'s':''} en retard (${eur(retard.reduce((s,f)=>s+totalDoc(f),0))}). <a href="#/factures/retard">Voir</a></div>`;
  const nbDocs=D.factures.length+D.devis.length;
  const ds=D.derniereSauvegarde;
  if(nbDocs&&(!ds||(Date.now()-new Date(ds).getTime())>30*864e5))h+=`<div class="alert">Pensez à sauvegarder vos données ${ds?'(dernière sauvegarde le '+fdate(ds.slice(0,10))+')':'(jamais faite)'}. <a href="#/sauvegarde">Sauvegarder</a></div>`;
  h+=`<div class="btns"><a class="btn primary" href="#/devis-edit/nouveau">+ Nouveau devis</a><a class="btn primary" href="#/facture-edit/nouveau">+ Nouvelle facture</a></div>`;
  h+=`<div class="kpis">
    <div class="kpi"><div class="l">Encaissé ce mois-ci</div><div class="v">${eur(mois.total)}</div></div>
    <div class="kpi"><div class="l">Encaissé en ${y}</div><div class="v">${eur(an.total)}</div></div>
    <div class="kpi"><div class="l">À encaisser</div><div class="v">${eur(aEnc.reduce((s,f)=>s+totalDoc(f),0))}</div></div>
    <div class="kpi"><div class="l">Cotisations estimées ${y}</div><div class="v">${eur(an.cotis)}</div></div></div>`;

  (l.length?`<div class="list">${l.map(a=>`<a class="item" href="#/achat-edit/${a.id}"><div class="grow"><div class="t">${esc(a.fournisseur)}</div><div class="s">${fdate(a.date)} · ${esc(a.objet)}</div></div><div class="amount">${eur(a.montant)}</div></a>`).join('')}</div>
  <div class="card row"><div class="grow">Total ${y}</div><div class="amount">${eur(tot)}</div></div>
  <button class="btn block" onclick="App.csvAchats('${y}')">Exporter en tableur (CSV)</button>`:`<div class="empty">Aucun achat en ${y}. En vente de marchandises, ce registre est obligatoire. Gardez aussi vos justificatifs.</div>`)}
function vAchatEdit(id){const a=id&&id!=='nouveau'?parId(D.achats,id):{id:'',date:today(),fournisseur:'',objet:'',montant:'',mode:'carte bancaire',piece:''};if(!a)return go('#/achats');
  titre(a.id?'Modifier l’achat':'Nouvel achat','#/achats');
  return `<form class="card" onsubmit="App.sauverAchat(event,'${a.id}')">
  <div class="grid2"><label class="f">Date *<input type="date" name="date" required value="${a.date}"></label><label class="f">Montant TTC (€) *<input name="montant" inputmode="decimal" required value="${esc(String(a.montant).replace('.',','))}"></label></div>
  <label class="f">Fournisseur *<input name="fournisseur" required value="${esc(a.fournisseur)}"></label>
  <label class="f">Objet<input name="objet" placeholder="Ex. : matériel, carburant…" value="${esc(a.objet)}"></label>
  <div class="grid2"><label class="f">Payé par<select name="mode">${['carte bancaire','virement','espèces','chèque','autre'].map(m=>`<option ${m===a.mode?'selected':''}>${m}</option>`).join('')}</select></label><label class="f">N° de facture fournisseur<input name="piece" value="${esc(a.piece)}"></label></div>
  <button class="btn primary block">Enregistrer</button>
  ${a.id?`<div style="height:8px"></div><button type="button" class="btn danger block" onclick="App.supprimerAchat('${a.id}')">Supprimer</button>`:''}
  </form>`}

/* ============ Livre des recettes ============ */
function recettes(y){return D.factures.filter(f=>f.statut==='payee'&&f.paiement&&f.paiement.date.startsWith(y)).sort((a,b)=>a.paiement.date.localeCompare(b.paiement.date)||a.numero.localeCompare(b.numero))}
function vRecettes(y){y=y||today().slice(0,4);titre('Livre des recettes','#/plus');const l=recettes(y);const e=encaisse(y+'-01-01',y+'-12-31');
  return selAnnee('recettes',y)+`<div class="kpis"><div class="kpi"><div class="l">Ventes ${y}</div><div class="v">${eur(e.vente)}</div></div><div class="kpi"><div class="l">Services ${y}</div><div class="v">${eur(e.service)}</div></div></div>`+
  (l.length?`<div class="card scroll"><table class="t"><thead><tr><th>Encaissé le</th><th>Facture</th><th>Client</th><th>Moyen</th><th class="n">Montant</th></tr></thead><tbody>${l.map(f=>`<tr><td>${fdate(f.paiement.date)}</td><td><a href="#/voir/facture/${f.id}">${esc(f.numero)}</a></td><td>${esc(f.client.nom)}</td><td>${esc(f.paiement.mode)}</td><td class="n">${eur(totalDoc(f))}</td></tr>`).join('')}</tbody><tfoot><tr><th colspan="4">Total</th><th class="n">${eur(e.total)}</th></tr></tfoot></table></div>
  <button class="btn block" onclick="App.csvRecettes('${y}')">Exporter en tableur (CSV)</button>`:`<div class="empty">Le livre se remplit tout seul quand vous marquez une facture comme payée.</div>`)}

/* ============ Entreprise ============ */
function vEntreprise(){titre('Mon entreprise','#/plus');const e=D.entreprise,p=D.params;
  return `<form onsubmit="App.sauverEntreprise(event)"><div class="card">
  <label class="f">Prénom et nom *<input name="prenomNom" required value="${esc(e.prenomNom)}" placeholder="Ex. : Camille Martin"></label>
  <p class="small muted" style="margin:-6px 0 12px">La mention « EI » (entrepreneur individuel) est ajoutée automatiquement sur vos documents.</p>
  <label class="f">Nom commercial (facultatif)<input name="nomCommercial" value="${esc(e.nomCommercial)}"></label>
  <label class="f">SIRET *<input name="siret" inputmode="numeric" required value="${esc(e.siret)}"></label>
  <label class="f">Adresse *<input name="adresse" required value="${esc(e.adresse)}"></label>
  <div class="grid2"><label class="f">Code postal<input name="cp" inputmode="numeric" value="${esc(e.cp)}"></label><label class="f">Ville<input name="ville" value="${esc(e.ville)}"></label></div>
  <div class="grid2"><label class="f">E-mail<input name="email" type="email" value="${esc(e.email)}"></label><label class="f">Téléphone<input name="tel" type="tel" value="${esc(e.tel)}"></label></div>
  <label class="f">Activité principale<select name="activite"><option value="service" ${e.activite!=='vente'?'selected':''}>Prestations de services (artisan, commerçant)</option><option value="vente" ${e.activite==='vente'?'selected':''}>Vente de marchandises</option></select></label>
  <label class="f">Logo (facultatif)<input type="file" accept="image/*" onchange="App.logo(this)"></label>
  <div id="logoPrev">${e.logo?`<img src="${e.logo}" style="max-height:60px;max-width:160px"> <button type="button" class="btn sm" onclick="App.retirerLogo()">Retirer</button>`:''}</div>
  </div>
  <h2>Paiement</h2><div class="card">
  <label class="f">Délai de paiement (jours)<input name="delai" inputmode="numeric" value="${esc(e.delai)}"></label>
  <label class="f">IBAN (pour être payé par virement)<input name="iban" value="${esc(e.iban)}"></label>
  <label class="f">BIC<input name="bic" value="${esc(e.bic)}"></label>
  </div>
  <h2>Mentions</h2><div class="card">
  <label class="f">Assurance professionnelle<textarea name="assurance" placeholder="Obligatoire pour les artisans du bâtiment (décennale) : nom de l'assureur, n° de contrat, zone couverte.">${esc(e.assurance)}</textarea></label>
  <label class="f">Autre mention en bas de page<textarea name="mentionLibre" placeholder="Ex. : Dispensé d'immatriculation au registre du commerce et des sociétés (RCS) et au répertoire des métiers (RM)">${esc(e.mentionLibre)}</textarea></label>
  </div>
  <h2>Taux et plafonds</h2><div class="card">
  <p class="small muted" style="margin-top:0">Valeurs 2026 pour les micro-entrepreneurs. Modifiez-les si elles changent.</p>
  <div class="grid2"><label class="f">Cotisations ventes (%)<input name="tauxVente" inputmode="decimal" value="${String(p.tauxVente).replace('.',',')}"></label><label class="f">Cotisations services (%)<input name="tauxService" inputmode="decimal" value="${String(p.tauxService).replace('.',',')}"></label>
  <label class="f">Plafond total (€)<input name="plafondVente" inputmode="numeric" value="${p.plafondVente}"></label><label class="f">Plafond services (€)<input name="plafondService" inputmode="numeric" value="${p.plafondService}"></label>
  <label class="f">Franchise TVA total (€)<input name="tvaVente" inputmode="numeric" value="${p.tvaVente}"></label><label class="f">Franchise TVA services (€)<input name="tvaService" inputmode="numeric" value="${p.tvaService}"></label></div>
  <button type="button" class="btn sm" onclick="App.paramsDefaut()">Remettre les valeurs 2026</button>
  </div>
  <div class="total-bar"><div class="grow small muted">Tout est enregistré sur ce téléphone.</div><button class="btn primary">Enregistrer</button></div>
  </form>`}

/* ============ Sauvegarde ============ */
function vSauvegarde(){titre('Sauvegarde','#/plus');const ds=D.derniereSauvegarde;
  return `<div class="card"><b>Exporter mes données</b><p class="small muted">Crée un fichier avec tous vos clients, devis, factures et achats. Gardez-le en lieu sûr (mail à vous-même, Drive…). Il permet de tout retrouver sur un autre téléphone.</p>
  <p class="small">${ds?'Dernière sauvegarde : '+fdate(ds.slice(0,10)):'Aucune sauvegarde pour l’instant.'}</p><button class="btn primary block" onclick="App.exporter()">Exporter la sauvegarde</button></div>
  <div class="card"><b>Restaurer une sauvegarde</b><p class="small muted">Remplace toutes les données de ce téléphone par celles du fichier.</p><input type="file" accept=".json,application/json" onchange="App.importer(this)"></div>
  <div class="card"><b>Tout effacer</b><p class="small muted">Supprime toutes les données de ce téléphone. Exportez d'abord si besoin.</p><button class="btn danger block" onclick="App.toutEffacer()">Tout effacer</button></div>`}

/* ============ Aide ============ */
function vAide(){titre('Installer et aide','#/plus');
  return `<div class="card"><b>Mettre l'appli sur l'écran d'accueil</b>
  <p><b>Android (Chrome)</b> : menu ⋮ en haut à droite, puis « Installer l'application » ou « Ajouter à l'écran d'accueil ».</p>
  <p><b>iPhone (Safari)</b> : bouton Partager (carré avec une flèche), puis « Sur l'écran d'accueil ».</p>
  <p class="small muted">Ensuite, l'appli s'ouvre comme les autres, même sans internet.</p></div>
  <div class="card"><b>Faire un PDF</b><p>Sur un devis ou une facture, touchez « PDF / Imprimer », puis choisissez « Enregistrer au format PDF » (Android) ou faites un zoom avec deux doigts sur l'aperçu puis Partager (iPhone). Vous pouvez ensuite l'envoyer par mail ou WhatsApp.</p></div>
  <div class="card"><b>Bon à savoir</b>
  <p>• Les numéros de facture se suivent sans trou, comme l'exige la loi. Une facture ne se supprime pas.</p>
  <p>• Le livre des recettes se remplit quand vous marquez une facture payée.</p>
  <p>• À partir du 1er septembre 2027, les factures entre professionnels devront passer par une plateforme agréée. Une prochaine version permettra d'exporter vers ces plateformes.</p>
  <p>• Vos données ne quittent pas votre téléphone. Pensez à les sauvegarder régulièrement.</p></div>`}

/* ============ Actions ============ */
function formData(ev){ev.preventDefault();const o={};new FormData(ev.target).forEach((v,k)=>{o[k]=typeof v==='string'?v.trim():v});return o}
function telecharger(nom,contenu,type){const blob=new Blob([contenu],{type});
  const file=typeof File==='function'?new File([blob],nom,{type}):null;
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){navigator.share({files:[file],title:nom}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nom;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function csv(lignes){return '﻿'+lignes.map(l=>l.map(v=>{v=typeof v==='number'?String(v).replace('.',','):String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n')}

const App={
  sauverClient(ev,id){const o=formData(ev);if(!o.nom)return;
    let c=id?parId(D.clients,id):null;if(c)Object.assign(c,o);else{c=Object.assign({id:uid()},o);D.clients.push(c)}
    if(c.type!=='pro')c.siren='';enregistrer();toast('Client enregistré');
    if(RETOUR_CLIENT&&ED){ED.clientId=c.id;const r=RETOUR_CLIENT;RETOUR_CLIENT=null;go('#/'+r)}else go('#/clients')},
  supprimerClient(id){if(!confirm('Supprimer ce client ? Ses devis et factures sont conservés.'))return;D.clients=D.clients.filter(c=>c.id!==id);enregistrer();go('#/clients')},
  sauverProduit(ev,id){const o=formData(ev);o.pu=r2(num(o.pu));let p=id?parId(D.produits,id):null;if(p)Object.assign(p,o);else D.produits.push(Object.assign({id:uid()},o));enregistrer();toast('Article enregistré');go('#/catalogue')},
  supprimerProduit(id){if(!confirm('Supprimer cet article du catalogue ?'))return;D.produits=D.produits.filter(p=>p.id!==id);enregistrer();go('#/catalogue')},
  sauverAchat(ev,id){const o=formData(ev);o.montant=r2(num(o.montant));let a=id?parId(D.achats,id):null;if(a)Object.assign(a,o);else D.achats.push(Object.assign({id:uid()},o));enregistrer();toast('Achat enregistré');go('#/achats/'+o.date.slice(0,4))},
  supprimerAchat(id){if(!confirm('Supprimer cet achat ?'))return;D.achats=D.achats.filter(a=>a.id!==id);enregistrer();go('#/achats')},
  choixClient(v){if(v==='__nouveau'){go('#/client-edit/nouveau/'+(ED._type==='devis'?'devis-edit':'facture-edit')+'/'+ED._id);return}ED.clientId=v},
  edDate(v){const ancien=ED.date;ED.date=v;
    if(ED._type==='devis'){ if(!ED.validite||ED.validite===addDays(ancien,30)){ED.validite=addDays(v,30);const el=$('#edValid');if(el)el.value=ED.validite}}
    else{const del=num(D.entreprise.delai)||30;if(!ED.echeance||ED.echeance===addDays(ancien,del)){ED.echeance=addDays(v,del);const el=$('#edEch');if(el)el.value=ED.echeance}if(!ED.dateExecution||ED.dateExecution===ancien)ED.dateExecution=v}},
  majTotaux(){ED.lignes.forEach((l,i)=>{const el=$('#lt'+i);if(el)el.textContent=eur(num(l.qte)*num(l.pu))});$('#edTotal').textContent=eur(totalDoc(ED))},
  ajLigne(){ED.lignes.push(nouvelleLigne());$('#lignes').innerHTML=lignesHtml();App.majTotaux();const ins=$('#lignes').querySelectorAll('.ligne');ins[ins.length-1].querySelector('input').focus()},
  ajProduit(id){const p=parId(D.produits,id);if(!p)return;const l={designation:p.designation,qte:1,unite:p.unite||'',pu:p.pu,nature:p.nature};
    if(ED.lignes.length===1&&!ED.lignes[0].designation&&!num(ED.lignes[0].pu))ED.lignes[0]=l;else ED.lignes.push(l);$('#lignes').innerHTML=lignesHtml();App.majTotaux()},
  supLigne(i){ED.lignes.splice(i,1);$('#lignes').innerHTML=lignesHtml();App.majTotaux()},
  sauverDoc(){const type=ED._type;const liste=type==='devis'?D.devis:D.factures;
    const cl=parId(D.clients,ED.clientId);if(!cl){toast('Choisissez un client');$('#edClient').focus();return}
    const lignes=ED.lignes.filter(l=>String(l.designation).trim()||num(l.pu));
    if(!lignes.length){toast('Ajoutez au moins une ligne');return}
    if(lignes.some(l=>!String(l.designation).trim())){toast('Chaque ligne doit avoir une désignation');return}
    if(type==='facture'&&!entrepriseOk()&&!confirm("Votre fiche entreprise est incomplète (nom, SIRET, adresse). Enregistrer quand même ?"))return;
    const doc=JSON.parse(JSON.stringify(ED));delete doc._type;delete doc._id;
    doc.lignes=lignes.map(l=>({designation:String(l.designation).trim(),qte:num(l.qte),unite:l.unite||'',pu:r2(num(l.pu)),nature:l.nature==='vente'?'vente':'service'}));
    doc.client={nom:cl.nom,type:cl.type,siren:cl.siren,adresse:cl.adresse,cp:cl.cp,ville:cl.ville,email:cl.email};
    if(!doc.id){doc.id=uid();doc.cree=new Date().toISOString();doc.numero=prochainNumero(type,doc.date);
      if(type==='devis')doc.statut='brouillon';else{doc.statut='emise';const e=Object.assign({},D.entreprise);doc.emetteur=e}
      liste.push(doc);
      if(type==='facture'&&doc.devisId){const dv=parId(D.devis,doc.devisId);if(dv){dv.statut='facture';dv.factureId=doc.id}}}
    else{const i=liste.findIndex(x=>x.id===doc.id);if(type==='facture'){doc.emetteur=Object.assign({},D.entreprise)}liste[i]=doc}
    if(enregistrer()){ED=null;toast(type==='devis'?'Devis enregistré':'Facture enregistrée');go('#/voir/'+type+'/'+doc.id)}},
  statutDevis(id,s){const d=parId(D.devis,id);d.statut=s;enregistrer();route()},
  devisVersFacture(id){const d=parId(D.devis,id);const t=today();
    ED={id:'',date:t,dateExecution:t,echeance:addDays(t,num(D.entreprise.delai)||30),clientId:d.clientId,lignes:JSON.parse(JSON.stringify(d.lignes)),notes:d.notes||'',devisId:d.id,_type:'facture',_id:'nouveau'};
    if(!parId(D.clients,d.clientId)){toast('Le client de ce devis a été supprimé : choisissez-en un')}
    go('#/facture-edit/nouveau')},
  dupliquer(type,id){const src=parId(type==='devis'?D.devis:D.factures,id);const t=today();
    ED={id:'',date:t,clientId:src.clientId,lignes:JSON.parse(JSON.stringify(src.lignes)),notes:src.notes||'',_type:type,_id:'nouveau'};
    if(type==='devis')ED.validite=addDays(t,30);else{ED.dateExecution=t;ED.echeance=addDays(t,num(D.entreprise.delai)||30)}
    go('#/'+type+'-edit/nouveau')},
  supprimerDevis(id){if(!confirm('Supprimer ce devis ?'))return;D.devis=D.devis.filter(d=>d.id!==id);enregistrer();go('#/devis')},
  payer(id){const f=parId(D.factures,id);const date=$('#pDate').value||today();f.statut='payee';f.paiement={date,mode:$('#pMode').value};enregistrer();toast('Paiement enregistré');route()},
  annulerPaiement(id){if(!confirm('Annuler le paiement de cette facture ?'))return;const f=parId(D.factures,id);f.statut='emise';delete f.paiement;enregistrer();route()},
  imprimer(type,id){const d=parId(type==='devis'?D.devis:D.factures,id);$('#print').innerHTML=docHtml(type,d);
    const ancien=document.title;const cl=(d.client&&d.client.nom||'').replace(/[^\w\- ]+/g,'').trim();document.title=(type==='devis'?'Devis ':'Facture ')+d.numero+(cl?' '+cl:'');
    const fin=()=>{document.title=ancien;window.removeEventListener('afterprint',fin)};window.addEventListener('afterprint',fin);
    setTimeout(()=>{try{window.print()}catch(e){toast('Impression impossible ici')}setTimeout(fin,4000)},50)},
  sauverEntreprise(ev){const o=formData(ev);const pk=['tauxVente','tauxService','plafondVente','plafondService','tvaVente','tvaService'];
    pk.forEach(k=>{D.params[k]=num(o[k])||PARAMS_DEFAUT[k];delete o[k]});o.delai=Math.max(0,Math.round(num(o.delai)));
    Object.assign(D.entreprise,o);enregistrer();toast('Fiche enregistrée');go('#/accueil')},
  paramsDefaut(){D.params=Object.assign({},PARAMS_DEFAUT);enregistrer();route();toast('Valeurs 2026 remises')},
  logo(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
      const max=400;const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);D.entreprise.logo=c.toDataURL('image/png');
      if(D.entreprise.logo.length>300000)D.entreprise.logo=(x.fillStyle='#fff',x.globalCompositeOperation='destination-over',x.fillRect(0,0,c.width,c.height),c.toDataURL('image/jpeg',.85));
      enregistrer();$('#logoPrev').innerHTML=`<img src="${D.entreprise.logo}" style="max-height:60px;max-width:160px"> <button type="button" class="btn sm" onclick="App.retirerLogo()">Retirer</button>`;toast('Logo ajouté')};img.src=r.result};r.readAsDataURL(f)},
  retirerLogo(){D.entreprise.logo='';enregistrer();$('#logoPrev').innerHTML=''},
  csvRecettes(y){const l=recettes(y);const rows=[['Date encaissement','N° facture','Client','Nature','Montant ventes','Montant services','Total','Moyen de paiement']];
    l.forEach(f=>{const p=partsDoc(f);rows.push([fdate(f.paiement.date),f.numero,f.client.nom,natureOperation(f),p.vente,p.service,totalDoc(f),f.paiement.mode])});telecharger('livre-des-recettes-'+y+'.csv',csv(rows),'text/csv')},
  csvAchats(y){const rows=[['Date','Fournisseur','Objet','Montant','Moyen de paiement','N° pièce']];
    D.achats.filter(a=>a.date.startsWith(y)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(a=>rows.push([fdate(a.date),a.fournisseur,a.objet,num(a.montant),a.mode,a.piece]));telecharger('registre-des-achats-'+y+'.csv',csv(rows),'text/csv')},
  exporter(){D.derniereSauvegarde=new Date().toISOString();enregistrer();telecharger('kwik-sauvegarde-'+today()+'.json',JSON.stringify(Object.assign({app:'Kwik',version:1},D),null,1),'application/json');route()},
  importer(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.factures)||!Array.isArray(d.clients))throw 0;
      if(!confirm(`Remplacer les données de ce téléphone par ce fichier (${d.factures.length} factures, ${(d.devis||[]).length} devis, ${d.clients.length} clients) ?`)){input.value='';return}
      delete d.app;delete d.version;const v=vide();D=Object.assign(v,d);D.entreprise=Object.assign(vide().entreprise,d.entreprise||{});D.params=Object.assign({},PARAMS_DEFAUT,d.params||{});enregistrer();toast('Sauvegarde restaurée');go('#/accueil')}catch(e){alert("Ce fichier n'est pas une sauvegarde Kwik valide.")}};r.readAsText(f)},
  toutEffacer(){if(!confirm('Effacer TOUTES les données de ce téléphone ?'))return;if(!confirm('Vraiment ? Cette action est définitive.'))return;D=vide();enregistrer();toast('Données effacées');go('#/accueil')}
};
window.App=App;window.majTypeClient=majTypeClient;
route();
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.self===window.top){navigator.serviceWorker.register('sw.js').catch(()=>{})}
