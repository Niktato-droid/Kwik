      if(type==='facture'&&doc.devisId){const dv=parId(D.devis,doc.devisId);if(dv){dv.statut='facture';dv.factureId=doc.id;dv.maj=doc.maj}}
      if(type==='facture'&&doc.remplace){const o=parId(D.factures,doc.remplace);if(o&&!o.annulee){creerAvoir(o);o.remplaceePar=doc.id}}}
    else{const i=liste.findIndex(x=>x.id===doc.id);if(type==='facture')doc.emetteur=figerEmetteur();liste[i]=doc}
    if(enregistrer()){ED=null;const premier=liste.length===1;toast(premier?(type==='devis'?'🎉 Votre premier devis !':'🎉 Votre première facture !'):(type==='devis'?'Devis enregistré':'Facture enregistrée'));if(premier)confettis();go('#/voir/'+type+'/'+doc.id)}},
  statutDevis(id,s){const d=parId(D.devis,id);d.statut=s;d.maj=new Date().toISOString();enregistrer();route()},
  devisVersFacture(id){const d=parId(D.devis,id);const t=today();
    ED={id:'',date:t,dateExecution:t,echeance:addDays(t,delaiJ()),clientId:d.clientId,lignes:JSON.parse(JSON.stringify(d.lignes)),notes:d.notes||'',devisId:d.id,_type:'facture',_id:'nouveau'};
    if(!parId(D.clients,d.clientId))toast('Le client de ce devis a été supprimé : choisissez-en un');
    go('#/facture-edit/nouveau')},
  dupliquer(type,id){closeSheet();const src=parId(listeDe(type),id);const t=today();
    ED={id:'',date:t,clientId:src.clientId,lignes:JSON.parse(JSON.stringify(src.lignes)),notes:src.notes||'',_type:type,_id:'nouveau'};
    if(type==='devis')ED.validite=addDays(t,30);else{ED.dateExecution=t;ED.echeance=addDays(t,delaiJ())}
    go('#/'+type+'-edit/nouveau')},
  sheetActions(type,id){const d=parId(listeDe(type),id);const isF=type==='facture',isA=type==='avoir';
    const it=(fn,ic,t,rouge)=>`<button class="item" onclick="${fn}" ${rouge?'style="color:var(--bad)"':''}><span class="av" ${rouge?'style="background:var(--bad-soft);color:var(--bad)"':''}>${svg(ic)}</span><span class="grow t">${t}</span></button>`;
    openSheet(`<h3>${esc(d.numero)}</h3><div class="list">
      ${it(`closeSheet();App.pdf('${type}','${id}')`,'pdf','PDF')}
      ${it(`closeSheet();App.partager('${type}','${id}')`,'share',isF&&enRetard(d)?'Relancer le client':'Envoyer')}
      ${it(`closeSheet();App.imprimer('${type}','${id}')`,'print','Imprimer')}
      ${!isA?it(`App.dupliquer('${type}','${id}')`,'copy','Dupliquer'):''}
      ${isF&&d.statut==='payee'&&!d.annulee?it(`App.annulerPaiement('${id}')`,'x',"Annuler l'encaissement"):''}
      ${isA&&d.statut==='rembourse'?it(`App.annulerRemboursement('${id}')`,'x','Annuler le remboursement'):''}
      ${isF&&!d.annulee?it(`App.sheetAnnuler('${id}')`,'x','Annuler cette facture (avoir)',true):''}
      ${type==='devis'?it(`App.supprimerDevis('${id}')`,'trash','Supprimer le devis',true):''}
    </div>${isF?'<p class="small muted">Une facture ne se supprime pas : la loi impose une numérotation sans trou. Pour l’annuler, Kwik crée un avoir.</p>':''}`)},
  sheetCorriger(id){const f=parId(D.factures,id);
    openSheet(`<h3>Corriger ${esc(f.numero)}</h3><p class="muted" style="margin-top:-4px">Cette facture est déjà partie chez le client : on ne la modifie plus. Voici ce que fait Kwik, comme le prévoit la loi :</p>
      <ol class="small" style="padding-left:20px;line-height:1.5"><li>il prépare une copie à corriger, qui aura un nouveau numéro ;</li><li>quand vous l'enregistrez, il crée un <b>avoir</b> qui annule ${esc(f.numero)}.</li></ol>
      <p class="small muted">Ensuite, envoyez la nouvelle facture au client.</p>
      <button class="btn primary block" onclick="App.corriger('${id}')">Préparer la facture corrigée</button><div style="height:8px"></div><button class="btn ghost block" onclick="closeSheet()">Retour</button>`)},
  corriger(id){const f=parId(D.factures,id);const t=today();closeSheet();
    ED={id:'',date:t,dateExecution:f.dateExecution||f.date,echeance:addDays(t,delaiJ()),clientId:f.clientId,lignes:JSON.parse(JSON.stringify(f.lignes)),notes:f.notes||'',remplace:f.id,_type:'facture',_id:'nouveau'};
    if(f.devisId)ED.devisId=f.devisId;
    if(!parId(D.clients,f.clientId))toast('Le client de cette facture a été supprimé : choisissez-en un');
    setTimeout(()=>go('#/facture-edit/nouveau'),250)},
  sheetAnnuler(id){const f=parId(D.factures,id);const paye=f.statut==='payee';closeSheet();
    setTimeout(()=>openSheet(`<h3>Annuler ${esc(f.numero)} ?</h3><p class="muted" style="margin-top:-4px">Une facture ne se supprime pas. Kwik crée un <b>avoir</b> : un document qui annule la facture, avec son propre numéro. ${paye?'Comme elle est payée, il faudra rembourser le client : l’avoir vous le rappellera.':'Le client ne vous devra plus rien.'}</p>
      <button class="btn block" style="background:var(--bad);color:#fff" onclick="App.annulerFacture('${id}')">Créer l'avoir et annuler</button><div style="height:8px"></div><button class="btn ghost block" onclick="closeSheet()">Retour</button>
      ${!paye?`<p class="small muted">Vous voulez seulement corriger une erreur ? Utilisez plutôt « ${f.envoyee?'Corriger':'Modifier'} ».</p>`:''}`),260)},
  annulerFacture(id){const f=parId(D.factures,id);if(!f||f.annulee)return;const a=creerAvoir(f);if(enregistrer()){closeSheet();toast('Avoir '+a.numero+' créé');go('#/voir/avoir/'+a.id)}},
  sheetRembourser(id){const a=parId(D.avoirs,id);
    openSheet(`<h3>Rembourser ${eur(totalDoc(a))}</h3><p class="muted" style="margin-top:-6px">${esc(a.client.nom)} · ${esc(a.numero)}</p>
    <label class="f">Remboursé le<input type="date" id="pDate" value="${today()}"></label>
    <div class="f"><span style="font-size:13.5px;font-weight:600;color:var(--muted)">Moyen</span><div class="chips" style="margin-top:8px;flex-wrap:wrap" id="pModes">${['virement','espèces','chèque','carte bancaire','autre'].map((m,i)=>`<button type="button" class="chip ${i===0?'on':''}" onclick="document.querySelectorAll('#pModes .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${m}</button>`).join('')}</div></div>
    <p class="small muted">Le remboursement sera retiré de votre chiffre d'affaires à cette date.</p>
    <button class="btn hi block" onclick="App.rembourser('${id}')">${svg('check')} Confirmer le remboursement</button>`)},
  rembourser(id){const a=parId(D.avoirs,id);const m=document.querySelector('#pModes .chip.on');a.statut='rembourse';a.paiement={date:$('#pDate').value||today(),mode:m?m.textContent:'virement'};a.maj=new Date().toISOString();enregistrer();closeSheet();toast('Remboursement noté');route()},
  async annulerRemboursement(id){closeSheet();await new Promise(r=>setTimeout(r,260));if(!await ask('Annuler le remboursement ?','L’avoir repassera « à rembourser ».','Annuler le remboursement',true))return;const a=parId(D.avoirs,id);a.statut='a_rembourser';delete a.paiement;enregistrer();route()},
  /* Avant le PDF ou l'envoi : prévenir s'il manque quelque chose. Renvoie true si une feuille a été ouverte. */
  bloqueVerifs(type,id,action){const d=parId(listeDe(type),id);if(!docAVerifier(type,d))return false;const v=verifs(type,d);if(!v.length)return false;
    openSheet(`<h3>Avant ${action==='pdf'?'de faire le PDF':"d'envoyer"}</h3>${v.map(x=>`<p style="margin:10px 0"><b>${esc(x[0])}</b><br><span class="muted">${esc(x[1])}</span></p>`).join('')}
      <a class="btn primary block" href="#/entreprise" onclick="closeSheet()">Compléter maintenant</a><div style="height:8px"></div>
      <button class="btn ghost block" onclick="closeSheet();App.${action==='pdf'?'pdf':'partager'}('${type}','${id}',true)">${action==='pdf'?'Faire le PDF quand même':'Envoyer quand même'}</button>`);return true},
  async pdf(type,id,force){const d=parId(listeDe(type),id);if(!force&&App.bloqueVerifs(type,id,'pdf'))return;
    let f;try{f=await fichierPdf(type,d)}catch(e){toast('PDF impossible : essayez « Imprimer »');return}
    if(navigator.canShare&&navigator.canShare({files:[f]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){try{await navigator.share({files:[f],title:f.name});marquerEnvoye(type,d,true);route()}catch(e){if(!(e&&e.name==='AbortError')){telechargerFichier(f);marquerEnvoye(type,d,true);route()}}return}
    telechargerFichier(f);marquerEnvoye(type,d,true);toast('PDF enregistré : '+f.name);route()},
  async supprimerDevis(id){closeSheet();await new Promise(r=>setTimeout(r,260));if(!await ask('Supprimer ce devis ?','','Supprimer',true))return;D.devis=D.devis.filter(d=>d.id!==id);enregistrer();toast('Devis supprimé');go('#/devis')},
  sheetPayer(id){const f=parId(D.factures,id);
    openSheet(`<h3>Encaisser ${eur(totalDoc(f))}</h3><p class="muted" style="margin-top:-6px">${esc(f.client.nom)} · ${esc(f.numero)}</p>
    <label class="f">Payée le<input type="date" id="pDate" value="${today()}"></label>
    <div class="f"><span style="font-size:13.5px;font-weight:600;color:var(--muted)">Moyen de paiement</span><div class="chips" style="margin-top:8px;flex-wrap:wrap" id="pModes">${['virement','espèces','chèque','carte bancaire','autre'].map((m,i)=>`<button type="button" class="chip ${i===0?'on':''}" onclick="document.querySelectorAll('#pModes .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${m}</button>`).join('')}</div></div>
    <button class="btn hi block" onclick="App.payer('${id}')">${svg('check')} Confirmer l'encaissement</button>`)},
  payer(id){const f=parId(D.factures,id);const date=$('#pDate').value||today();const m=document.querySelector('#pModes .chip.on');f.statut='payee';f.paiement={date,mode:m?m.textContent:'virement'};f.maj=new Date().toISOString();enregistrer();closeSheet();toast('💶 '+eur(totalDoc(f))+' encaissés !');confettis();route()},
  async annulerPaiement(id){closeSheet();await new Promise(r=>setTimeout(r,260));if(!await ask("Annuler l'encaissement ?",'La facture repassera « à encaisser » et sortira du livre des recettes.','Annuler l’encaissement',true))return;const f=parId(D.factures,id);f.statut='emise';delete f.paiement;enregistrer();route()},
  async partager(type,id,force){const d=parId(listeDe(type),id);if(!force&&App.bloqueVerifs(type,id,'envoyer'))return;
    const txt=messageDoc(type,d);let f=null;try{f=await fichierPdf(type,d)}catch(e){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:txt,title:f.name});marquerEnvoye(type,d);route();return}catch(e){if(e&&e.name==='AbortError')return}}
    else if(!f&&navigator.share){try{await navigator.share({text:txt});marquerEnvoye(type,d);route();return}catch(e){if(e&&e.name==='AbortError')return}}
    App._envoi={type,id,f};const sujet=nomFichier(type,d);
    openSheet(`<h3>Envoyer ${esc(d.numero)}</h3><p class="small muted" style="margin-top:-6px">1. Enregistrez le PDF. 2. Copiez le message. 3. Collez-le dans un mail, un SMS ou WhatsApp, avec le PDF en pièce jointe.</p>
      ${f?`<button class="btn primary block" onclick="App.telechargerEnvoi()">${svg('pdf')} Enregistrer le PDF</button><div style="height:10px"></div>`:''}
      <textarea class="field" id="msgTxt" style="min-height:170px">${esc(txt)}</textarea><div style="height:10px"></div>
      <button class="btn block" onclick="App.copier()">${svg('copy')} Copier le message</button>
      ${d.client&&d.client.email?`<div style="height:10px"></div><a class="btn ghost block" href="mailto:${encodeURIComponent(d.client.email)}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(txt)}" onclick="App.envoiFait()">Ouvrir ma messagerie</a>`:''}`)},
  telechargerEnvoi(){const x=App._envoi;if(!x||!x.f)return;telechargerFichier(x.f);App.envoiFait();toast('PDF enregistré')},
  envoiFait(){const x=App._envoi;if(!x)return;const d=parId(listeDe(x.type),x.id);if(d)marquerEnvoye(x.type,d)},
  async copier(){const t=$('#msgTxt');App.envoiFait();try{await navigator.clipboard.writeText(t.value);toast('Message copié')}catch(e){t.select();toast('Sélectionné : faites Copier')}},
  imprimer(type,id){const d=parId(listeDe(type),id);avantSortie(type,d);marquerEnvoye(type,d,true);$('#print').innerHTML=docHtml(type,d);
    const ancien=document.title;const cl=(d.client&&d.client.nom||'').replace(/[^\w\- ]+/g,'').trim();document.title=(type==='devis'?'Devis ':'Facture ')+d.numero+(cl?' '+cl:'');
    const fin=()=>{document.title=ancien;window.removeEventListener('afterprint',fin)};window.addEventListener('afterprint',fin);
    setTimeout(()=>{try{window.print()}catch(e){toast('Impression impossible ici')}setTimeout(fin,4000)},50)},
  sauverEntreprise(ev){const o=formData(ev);TAUX_NUM.forEach(k=>{D.params[k]=num(o[k])||PARAMS_DEFAUT[k];delete o[k]});
    D.params.registre=o.registre==='commercant'?'commercant':'artisan';D.params.acre=!!o.acre;D.params.vl=!!o.vl;delete o.registre;delete o.acre;delete o.vl;o.delai=Math.max(0,Math.round(num(o.delai)));o.cgvDevis=!!o.cgvDevis;o.cgvFacture=!!o.cgvFacture;
    Object.assign(D.entreprise,o);if(D.entreprise.mediateurNom&&D.entreprise.cgv)D.entreprise.cgv=D.entreprise.cgv.replace('[nom et site du médiateur]',texteMediateur());enregistrer();toast('Fiche enregistrée');go('#/accueil')},
  paramsDefaut(){TAUX_NUM.forEach(k=>D.params[k]=PARAMS_DEFAUT[k]);enregistrer();route();toast('Valeurs officielles remises')},
  logo(input,wz){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
      const max=400;const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);D.entreprise.logo=c.toDataURL('image/png');
      if(D.entreprise.logo.length>300000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);D.entreprise.logo=c.toDataURL('image/jpeg',.85)}
      enregistrer();if(!wz)$('#logoPrev').innerHTML=`<img src="${D.entreprise.logo}" style="max-height:60px;max-width:160px"> <button type="button" class="btn sm ghost" onclick="App.retirerLogo()">Retirer</button>`;toast('Logo ajouté');if(wz){const a=$('#wzApercu');if(a)a.innerHTML=miniDoc()}};img.src=r.result};r.readAsDataURL(f)},
  retirerLogo(){D.entreprise.logo='';enregistrer();$('#logoPrev').innerHTML=''},
  csvRecettes(y){const rows=[['Date encaissement','N° facture','Client','Nature','Montant ventes','Montant services','Total','Moyen de paiement']];
    recettes(y).forEach(r=>{const p=partsDoc(r.d);rows.push([fdate(r.date),r.d.numero,r.d.client.nom,r.type==='avoir'?'Remboursement (avoir sur '+r.d.factureNumero+')':natureOperation(r.d),r.signe*p.vente,r.signe*p.service,r.signe*totalDoc(r.d),r.mode])});telecharger('livre-des-recettes-'+y+'.csv',csv(rows),'text/csv')},
  csvAchats(y){const rows=[['Date','Fournisseur','Objet','Montant','Moyen de paiement','N° pièce']];
    D.achats.filter(a=>a.date.startsWith(y)).sort((a,b)=>a.date.localeCompare(b.date)).forEach(a=>rows.push([fdate(a.date),a.fournisseur,a.objet,num(a.montant),a.mode,a.piece]));telecharger('registre-des-achats-'+y+'.csv',csv(rows),'text/csv')},
  exporter(){D.derniereSauvegarde=new Date().toISOString();enregistrer();telecharger('kwik-sauvegarde-'+today()+'.json',JSON.stringify(Object.assign({app:'Kwik',version:1},D),null,1),'application/json');route()},
  importer(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{let d;try{d=JSON.parse(r.result);if(!d||!Array.isArray(d.factures)||!Array.isArray(d.clients))throw 0}catch(e){info('Fichier non reconnu',"Ce fichier n'est pas une sauvegarde Kwik.");input.value='';return}
      if(!await ask('Restaurer cette sauvegarde ?',`${d.factures.length} factures, ${(d.devis||[]).length} devis et ${d.clients.length} clients remplaceront les données de ce téléphone.`,'Restaurer',true)){input.value='';return}
      delete d.app;delete d.version;D=fusion(d);compacter();enregistrer();toast('Sauvegarde restaurée');go('#/accueil')};r.readAsText(f)},
  async toutEffacer(){if(!await ask('Tout effacer ?','Toutes les données de ce téléphone seront supprimées.','Continuer',true))return;await new Promise(r=>setTimeout(r,260));if(!await ask('Vraiment tout effacer ?','Cette action est définitive.','Tout effacer',true))return;D=vide();enregistrer();toast('Données effacées');go('#/accueil')}
};
appliquerApparence();
window.App=App;window.majTypeClient=majTypeClient;window.closeSheet=closeSheet;window.sheetMenu=sheetMenu;
if(!D.onboarded&&!entrepriseOk()&&!D.factures.length&&!D.devis.length&&!/bienvenue/.test(location.hash))location.replace('#/bienvenue/1');
route();
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.self===window.top){navigator.serviceWorker.register('sw.js').catch(()=>{})}
/* Une fois installée, Kwik demande au téléphone de ne jamais effacer ses données pour faire de la place. */
try{if(navigator.storage&&navigator.storage.persist&&((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone))navigator.storage.persisted().then(ok=>ok||navigator.storage.persist()).catch(()=>{})}catch(e){}
</script>
</body>
